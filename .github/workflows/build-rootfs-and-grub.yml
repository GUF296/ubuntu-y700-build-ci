name: Native ARM64 Ubuntu host preflight
on: workflow_dispatch
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: c91caa67eca4d33ec8cb8a0b5198ecebdc0ba9bc
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          # The semantic/isolation validators import PyYAML before the build
          # toolchain is installed.  Install the distro package explicitly so
          # validation does not depend on an incidental runner image module.
          sudo apt-get update
          # The extracted production data-loop regression runs a native C++17
          # fixture; its compiler is a test dependency, not the camera producer.
          sudo apt-get install -y python3-yaml g++ git openssl

      - name: Validate workflow input boundaries
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          bash scripts/ci/run-actionlint.sh .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/test-workflow-semantics.py --self-test
          python3 scripts/ci/test-workflow-semantics.py \
            .github/workflows/build-rootfs-and-grub.yml \
            scripts/ci/build-rootfs-image.sh \
            scripts/ci/apply-workflow-config.sh
          python3 scripts/ci/test-release-job-isolation.py --self-test
          python3 scripts/ci/test-release-job-isolation.py \
            .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/check-workflow-input-boundaries.py --self-test
          python3 scripts/ci/check-workflow-input-boundaries.py .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/check-action-pins.py --self-test
          python3 scripts/ci/check-action-pins.py .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/check-service-enable-policy.py --self-test
          python3 scripts/ci/check-service-enable-policy.py scripts/ci/build-rootfs-image.sh scripts/ci/build-y700-sensor-debs.sh
          python3 scripts/ci/test-safe-extract-archive.py
          python3 -B scripts/ci/test-camera-overlay-verifier.py
          python3 -B scripts/ci/test-camera-plugin-producer.py
          python3 -B scripts/ci/test-libcamera-source-export.py
          python3 -B scripts/ci/test-libcamera-source-materialization.py
          python3 -B scripts/ci/test-libcamera-build-adapter.py
          python3 -B scripts/ci/test-libcamera-build-environment.py
          python3 -B scripts/ci/test-libcamera-environment-preparation.py
          python3 -B scripts/ci/test-libcamera-runtime.py
          python3 -B scripts/ci/test-camera-runtime-dependencies.py
          python3 -B scripts/ci/test-camera-runtime-loader.py
          python3 -B scripts/ci/test-camera-artifact-handoff.py
          python3 -B scripts/ci/test-camera-release-assets.py
          python3 -B scripts/ci/test-camera-source-contract.py \
            source/tb321fu-camera-rootfs-overlay/source/libcamera-source.cpp.clean-minimal-daily
          python3 -B scripts/ci/test-camera-data-loop.py
          bash scripts/ci/test-camera-overlay-installer.sh
          bash scripts/ci/test-input-and-path-boundaries.sh
          bash scripts/ci/test-system-payload-policy.sh
          bash scripts/ci/test-audio-route-lifecycle.sh
          bash scripts/ci/test-qcom-sns-lifecycle.sh
          bash scripts/ci/test-gpu-deb-lifecycle.sh
          bash scripts/ci/test-openpgp-pin.sh
          bash scripts/ci/test-rootfs-overlay-boundary.sh
          bash scripts/ci/test-apt-provenance.sh
          bash scripts/ci/test-grub-template-policy.sh
          bash scripts/ci/test-release-publication.sh
          bash scripts/ci/test-release-manifest.sh
          bash scripts/ci/test-release-input-provenance.sh

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y \
            debootstrap dosfstools mtools e2fsprogs rsync curl unzip tar xz-utils zstd p7zip-full \
            gdisk qemu-utils sudo ca-certificates gnupg binutils patch kmod bc \
            device-tree-compiler flex bison m4 build-essential \
            meson ninja-build pkg-config protobuf-c-compiler gcc-aarch64-linux-gnu \
            libglib2.0-dev:arm64 libqmi-glib-dev:arm64 libgudev-1.0-dev:arm64 libpolkit-gobject-1-dev:arm64 libprotobuf-c-dev:arm64

      - name: Validate GRUB image integrity
        run: |
          set -euo pipefail
          bash scripts/ci/test-grub-image-integrity.sh

      - name: Validate kernel bootstrap policy
        run: |
          set -euo pipefail
          bash scripts/ci/test-kernel-bootstrap-policy.sh

      - name: Check native Ubuntu bootstrap
        run: |
          set -euo pipefail
          uname -m
          test "$(dpkg --print-architecture)" = arm64
          dpkg-query -W debootstrap distro-info distro-info-data ubuntu-keyring wget
          debootstrap --print-debs --arch=arm64 resolute "$RUNNER_TEMP/native-bootstrap-$$" https://ports.ubuntu.com/ubuntu-ports
          df -h "$GITHUB_WORKSPACE"
