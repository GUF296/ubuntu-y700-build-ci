name: Recover three missing assets of the R10 private prerelease
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: tb321fu-owned-draft-454078974
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.repository == 'GUF296/ubuntu-y700-build-ci' && github.ref == 'refs/heads/codex/r10-staged-upload-44962218886' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the exact helper commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify original artifacts and fill only absent draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/ci/recover-owned-r10.py
      - name: Save nonsecret transfer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-r10-draft-transfer
          path: r10-complete-private-draft-454078974.json
          if-no-files-found: error
