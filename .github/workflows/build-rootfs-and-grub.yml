name: TB321FU Noble ARM64 kernel host diagnostic
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  kernel-host-diagnostic:
    if: github.repository == 'GUF296/ubuntu-y700-build-ci' && github.ref == 'refs/heads/codex/diag-kernel-noble-arm64-3785607e-20261122'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: Checkout the unchanged product scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 3785607eaff3edcb260debbff7e3f948309ac46e
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/package-kernel-bootstrap.sh
            /scripts/ci/test-kernel-bootstrap-policy.sh
            /scripts/ci/common.sh
      - name: Install validation dependencies
        run: |
          set -euo pipefail
          # The semantic/isolation validators import PyYAML before the build
          # toolchain is installed.  Install the distro package explicitly so
          # validation does not depend on an incidental runner image module.
          sudo apt-get update
          # The extracted production data-loop regression runs a native C++17
          # fixture; its compiler is a test dependency, not the camera producer.
          # The early checks also invoke GPG, rsync and real ext4/FAT tools,
          # before the later kernel/rootfs build dependencies are installed.
          sudo apt-get install -y python3-yaml g++ git openssl shellcheck openssh-client gnupg rsync e2fsprogs dosfstools mtools
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y \
            debootstrap dosfstools mtools e2fsprogs rsync curl unzip tar xz-utils zstd p7zip-full \
            gdisk qemu-utils sudo ca-certificates gnupg binutils patch kmod bc \
            device-tree-compiler flex bison m4 build-essential \
            meson ninja-build pkg-config protobuf-c-compiler gcc-aarch64-linux-gnu \
            libglib2.0-dev:arm64 libqmi-glib-dev:arm64 libgudev-1.0-dev:arm64 libpolkit-gobject-1-dev:arm64 libprotobuf-c-dev:arm64
      - name: Classify ordinary bootstrap invocations
        run: |
          /usr/bin/python3 -IB - <<'TB321FU_NOBLE_PROBE'
          """One ordinary help invocation and the existing policy suite's invalid-commit invocation."""
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess as sp

          BASE="3785607eaff3edcb260debbff7e3f948309ac46e"
          PROD=Path("scripts/ci/package-kernel-bootstrap.sh")
          FIX=Path("scripts/ci/test-kernel-bootstrap-policy.sh")
          CANON="/usr/sbin:/usr/bin:/sbin:/bin"


          def need(ok,msg):
              if not ok: raise SystemExit(msg)


          def execute(*cmd,env=None):
              return sp.run(cmd,capture_output=True,stdin=sp.DEVNULL,timeout=55,env=env)


          def main():
              need(execute("git","rev-parse","HEAD").stdout.strip()==BASE.encode(),"wrong product commit")
              source=PROD.read_bytes()
              fixture=FIX.read_text()
              for path in (PROD,FIX,Path("scripts/ci/common.sh")):
                  old=execute("git","show",BASE+":"+str(path))
                  need(old.returncode==0 and old.stdout==path.read_bytes(),"checkout is not the immutable product")
              m=re.search(r"(?m)^common_env=\(\n((?:  [A-Z0-9_]+=[a-z0-9/=.-]+\n)+)\)$",fixture)
              need(m and fixture.count('invalid_commit_output=$(env "${common_env[@]}" EXPECTED_KERNEL_COMMIT=bad bash "$packager" 2>&1)')==1,
                   "different fixture")
              opts=dict(l.strip().split("=",1) for l in m[1].splitlines())
              need(len(opts)==8 and all(opts[k]=="/" for k in ("KERNEL_SOURCE_DIR","KERNEL_GIT_DIR","KERNEL_BUILD_DIR"))
                   and opts["BASE_DEVICE_DEB_ARCHIVE"]=="/nonexistent","changed fixture inputs")
              group=re.search(rb"(?ms)^for tool_spec in (.+?); do\n  resolve_tool_path",source)
              need(group,"producer tool set absent")
              tools=dict((a.decode(),b.decode()) for a,b in re.findall(rb"([A-Za-z0-9+_-]+):([A-Za-z0-9+_-]+)",group[1]))
              need(len(tools)>=50 and tools["awk"]=="awk","unrecognised bootstrap tools")
              print("ARCH",execute("/usr/bin/dpkg","--print-architecture").stdout.decode().strip(),
                    "TOOLS",len(tools),flush=True)
              env={"PATH":CANON,"HOME":"/nonexistent","LANG":"C","LC_ALL":"C","TZ":"UTC"}
              for pkg in "bash coreutils git make rsync kmod dpkg tar xz-utils device-tree-compiler util-linux gcc g++ binutils flex bison m4 perl pkg-config libc-bin mawk gawk".split():
                  r=execute("/usr/bin/dpkg-query","-W","-f=${Version}",pkg,env=env)
                  version=r.stdout.decode("ascii",errors="replace").strip()
                  print("DPKG",pkg,version if r.returncode==0 and re.fullmatch("[0-9a-zA-Z.~+:-]+",version) else "not-installed")
              # Match only the known product diagnostic classes, never echo arbitrary strings.
              def failure(out):
                  if b"EXPECTED_KERNEL_COMMIT must be 40 lowercase hex characters" in out: return "expected-invalid-commit"
                  safe=set(tools)|set(tools.values())
                  for msg in (b"required command not found",b"cannot resolve tool directory",b"cannot resolve tool",
                              b"tool is not an executable regular file",b"cannot hash locked tool",b"invalid locked tool version",
                              b"cannot stat locked tool",b"cannot stat locked tool invocation path",b"tool path was not locked"):
                      m=re.search(rb"(?m)^error: "+msg+rb": ([a-zA-Z0-9+_-]+)$",out)
                      if m and m[1].decode() in safe: return msg.decode()+": "+m[1].decode()
                  for literal in ("Bison data tree contains an unexpected mode","Bison data tree contains a symlink",
                                  "Bison data","cannot query","unexpected exported producer variable","invalid kernel bootstrap producer environment policy",
                                  "unsafe OUTPUT_DIR","OUTPUT_DIR basename","cannot resolve kernel bootstrap producer path","Permission denied",
                                  "No such file or directory","unbound variable","syntax error","command not found"):
                      if literal.encode() in out:return literal
                  return "unclassified-output-not-disclosed"
              script=str(PROD.resolve())
              help_result=execute("bash",script,"--help")
              invalid=execute("bash",script,env=dict(os.environ,**opts,EXPECTED_KERNEL_COMMIT="bad"))
              help_ok=help_result.returncode==0 and b"Usage: package-kernel-bootstrap.sh" in help_result.stdout
              category=failure(invalid.stdout+invalid.stderr)
              print("PRODUCT_HELP",help_result.returncode,"usage" if help_ok else failure(help_result.stdout+help_result.stderr))
              print("EXISTING_INVALID_COMMIT",invalid.returncode,category,flush=True)
              for label,cmd in tools.items():
                  exe=shutil.which(cmd,path=CANON)
                  if not exe: print("PROBE_MISSING_TOOL",label); continue
                  # Independent normal host versions, exactly the producer's first nonempty C-locale line rule.
                  r=sp.run([exe,*(["-W","version"] if label=="awk" else ["--version"])],stdin=sp.DEVNULL,
                           stdout=sp.PIPE,stderr=sp.STDOUT,timeout=8,env=env)
                  line=next((v for v in r.stdout.split(b"\n") if v),b"")
                  if not (0<len(line)<=255 and all(32<=c<127 for c in line)):
                      print("PROBE_TOOL_VERSION_NOT_PRINTABLE_OR_EMPTY",label,"first_line_bytes",len(line),"exit",r.returncode)
              need(help_ok and invalid.returncode!=0 and category=="expected-invalid-commit",
                   "HOSTED_PRODUCER_BOUNDARY=FAIL_CLASSIFIED")
              print("HOSTED_PRODUCER_BOUNDARY=PASS")


          if __name__=="__main__": main()

          TB321FU_NOBLE_PROBE
