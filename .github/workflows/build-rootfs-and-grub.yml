name: Privately verify the existing R10 Linux filesystem
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: tb321fu-r10-private-readback-44962218886
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ github.repository == 'GUF296/ubuntu-y700-build-ci' && github.ref == 'refs/heads/codex/r10-private-image-readback-44962218886' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact read-only helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Hash the existing image and select public APT fields
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/ci/r10-private-image.py
      - name: Save package solver state and hash receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r10-read-only-solver-evidence
          path: |
            sanitized-r10/solver-status
            sanitized-r10/extended_states
            sanitized-r10/receipt.json
          if-no-files-found: error
