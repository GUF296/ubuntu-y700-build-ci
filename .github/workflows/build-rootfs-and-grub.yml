name: Native ARM64 complete kernel bootstrap policy acceptance
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  native-kernel-policy:
    if: github.repository == 'GUF296/ubuntu-y700-build-ci' && github.ref == 'refs/heads/codex/diag-full-kernel-policy-d7505b60a951-20261122'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
    - name: Checkout exact repaired source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: d7505b60a9511e53d09adba1d0ce79ae29aa9324
        fetch-depth: 1
        persist-credentials: false
    - name: Install validation dependencies
      run: |
        set -euo pipefail
        # The semantic/isolation validators import PyYAML before the build
        # toolchain is installed.  Install the distro package explicitly so
        # validation does not depend on an incidental runner image module.
        sudo apt-get update
        # The extracted production data-loop regression runs a native C++17
        # fixture; its compiler is a test dependency, not the camera producer.
        # The early checks also invoke GPG, rsync and real ext4/FAT tools,
        # before the later kernel/rootfs build dependencies are installed.
        sudo apt-get install -y python3-yaml g++ git openssl shellcheck openssh-client gnupg rsync e2fsprogs dosfstools mtools
    - name: Install dependencies
      run: |
        set -euo pipefail
        sudo apt-get install -y \
          debootstrap dosfstools mtools e2fsprogs rsync curl unzip tar xz-utils zstd p7zip-full \
          gdisk qemu-utils sudo ca-certificates gnupg binutils patch kmod bc \
          device-tree-compiler flex bison m4 build-essential python3-apt \
          meson ninja-build pkg-config protobuf-c-compiler gcc-aarch64-linux-gnu \
          libglib2.0-dev:arm64 libqmi-glib-dev:arm64 libgudev-1.0-dev:arm64 libpolkit-gobject-1-dev:arm64 libprotobuf-c-dev:arm64
    - name: Validate kernel bootstrap policy
      run: |
        set -euo pipefail
        /usr/bin/python3 -IB scripts/ci/test-hosted-bison-fixture.py
        /usr/bin/python3 -IB scripts/ci/with-hosted-bison-fixture.py -- bash scripts/ci/test-kernel-bootstrap-policy.sh
