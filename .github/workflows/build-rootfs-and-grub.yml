name: Build RootFS And GRUB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要创建的全新 prerelease 标签；已有 tag/release 会被拒绝，留空只生成 Actions artifact。
        required: false
        type: string
      prerelease:
        description: 将非空 release_tag 发布为 prerelease，并且不设为 latest。
        required: true
        default: false
        type: boolean
      output_prefix:
        description: 输出文件名前缀；会用于 rootfs、grub 和 artifact 名称。
        required: true
        default: y700-kubuntu2604-arm64
        type: string
      ubuntu_mirror:
        description: Ubuntu 软件源地址；arm64 设备应使用 HTTPS 的 ports.ubuntu.com/ubuntu-ports。
        required: true
        default: https://ports.ubuntu.com/ubuntu-ports
        type: choice
        options:
          - https://ports.ubuntu.com/ubuntu-ports
      rootfs_image_size:
        description: rootfs ext4 镜像大小；可手填如 20G、24G、32768M，过小可能导致桌面环境安装失败。
        required: true
        default: 20G
        type: string
      rootfs_label:
        description: rootfs 文件系统卷标；只是 ext4 label，不决定刷入分区。
        required: true
        default: Ubuntu
        type: string
      hostname_name:
        description: 系统主机名；安装后会写入 /etc/hostname。
        required: true
        default: y700
        type: string
      rootfs_config:
        description: 可选高级 rootfs 覆盖配置，按 KEY=value 每行填写；不填则使用内置默认配置，常用选项已单独列出并会覆盖同名 KEY。
        required: false
        type: string
        default: ""
      boot_config:
        description: 可选高级 GRUB/FAT 启动镜像覆盖配置，按 KEY=value 每行填写；不填则使用内置默认配置，常用选项已单独列出并会覆盖同名 KEY。
        required: false
        type: string
        default: ""
      source_config:
        description: 可选高级内核/SDK 输入 profile，按 KEY=value 每行填写 URL、SHA-256 和 producer identity；通常无需修改。
        required: false
        type: string
        default: ""

concurrency:
  group: release-${{ github.repository }}-${{ inputs.release_tag != '' && inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  camera-producer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 65
    outputs:
      artifact_id: ${{ steps.upload_camera.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_camera.outputs.artifact-digest }}
    steps:
      - name: Checkout exact camera source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply camera build configuration
        env:
          INPUT_ROOTFS_CONFIG: ${{ inputs.rootfs_config }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rootfs.env" <<'CONFIG_EOF'
          ARCH=arm64
          BUILD_TB321FU_CAMERA_STACK=1
          CAMERA_STACK_ARCHIVE=
          CAMERA_STACK_ARCHIVE_SHA256=
          CAMERA_STACK_DIR=
          CONFIG_EOF
          python3 -I -B scripts/ci/camera-package-policy.py rootfs-default >> "$RUNNER_TEMP/rootfs.env"
          if [ -n "$INPUT_ROOTFS_CONFIG" ]; then
            printf '\n%s\n' "$INPUT_ROOTFS_CONFIG" >> "$RUNNER_TEMP/rootfs.env"
          fi
          scripts/ci/apply-workflow-config.sh "$RUNNER_TEMP/rootfs.env"

      - name: Install locked camera producer dependencies
        run: |
          set -euo pipefail
          bash scripts/ci/camera-producer-container.sh prepare

      - name: Validate camera producer contracts
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B scripts/ci/test-camera-artifact-handoff.py
          python3 -B scripts/ci/test-camera-release-assets.py
          python3 -B scripts/ci/test-camera-overlay-verifier.py
          python3 -B scripts/ci/test-camera-plugin-producer.py
          python3 -B scripts/ci/test-libcamera-source-export.py
          python3 -B scripts/ci/test-libcamera-source-materialization.py
          python3 -B scripts/ci/test-libcamera-build-adapter.py
          python3 -B scripts/ci/test-libcamera-build-environment.py
          python3 -B scripts/ci/test-libcamera-environment-preparation.py
          python3 -B scripts/ci/test-libcamera-runtime.py
          python3 -B scripts/ci/test-camera-runtime-dependencies.py
          python3 -B scripts/ci/test-camera-runtime-loader.py
          python3 -B scripts/ci/test-camera-source-contract.py \
            source/tb321fu-camera-rootfs-overlay/source/libcamera-source.cpp.clean-minimal-daily
          bash scripts/ci/test-camera-overlay-installer.sh

      - name: Build camera artifact handoff
        run: |
          set -euo pipefail
          . scripts/ci/common.sh
          ci_validate_bool "${BUILD_TB321FU_CAMERA_STACK:-}" BUILD_TB321FU_CAMERA_STACK
          install -d -m 0755 out/tb321fu-camera-stack-debs
          if [ "$BUILD_TB321FU_CAMERA_STACK" = 1 ]; then
            env OUTPUT_DIR=out/tb321fu-camera-stack-debs \
              ARCH="${ARCH:-arm64}" \
              CAMERA_STACK_DEB_VERSION="${CAMERA_STACK_DEB_VERSION:?camera version was not configured}" \
              CAMERA_STACK_ARCHIVE="${CAMERA_STACK_ARCHIVE:-}" \
              CAMERA_STACK_ARCHIVE_SHA256="${CAMERA_STACK_ARCHIVE_SHA256:-}" \
              CAMERA_STACK_DIR="${CAMERA_STACK_DIR:-}" \
              bash scripts/ci/camera-producer-container.sh build
          fi
          handoff_args=(
            --enabled="$BUILD_TB321FU_CAMERA_STACK"
            --arch="${ARCH:-arm64}"
            --version="${CAMERA_STACK_DEB_VERSION:?camera version was not configured}"
            --repository="$GITHUB_REPOSITORY"
            --commit="$GITHUB_SHA"
            --run-id="$GITHUB_RUN_ID"
            --run-attempt="$GITHUB_RUN_ATTEMPT"
            --source-archive="${CAMERA_STACK_ARCHIVE:-}"
            --source-archive-sha256="${CAMERA_STACK_ARCHIVE_SHA256:-}"
            --source-directory="${CAMERA_STACK_DIR:-}"
          )
          python3 -B scripts/ci/camera-artifact-handoff.py create \
            out/tb321fu-camera-stack-debs "${handoff_args[@]}"
          python3 -B scripts/ci/camera-artifact-handoff.py verify \
            out/tb321fu-camera-stack-debs "${handoff_args[@]}"

      - name: Stop isolated camera producer
        if: always()
        run: bash scripts/ci/camera-producer-container.sh stop

      - name: Upload camera artifact handoff
        id: upload_camera
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: camera-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/tb321fu-camera-stack-debs
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  build:
    needs: camera-producer
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          # The semantic/isolation validators import PyYAML before the build
          # toolchain is installed.  Install the distro package explicitly so
          # validation does not depend on an incidental runner image module.
          sudo apt-get update
          # The extracted production data-loop regression runs a native C++17
          # fixture; its compiler is a test dependency, not the camera producer.
          # The early checks also invoke GPG, rsync and real ext4/FAT tools,
          # before the later kernel/rootfs build dependencies are installed.
          sudo apt-get install -y python3-yaml g++ git openssl shellcheck openssh-client gnupg rsync e2fsprogs dosfstools mtools

      - name: Validate workflow input boundaries
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          bash scripts/ci/run-actionlint.sh .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/test-workflow-semantics.py --self-test
          python3 scripts/ci/test-workflow-semantics.py \
            .github/workflows/build-rootfs-and-grub.yml \
            scripts/ci/build-rootfs-image.sh \
            scripts/ci/apply-workflow-config.sh
          python3 scripts/ci/test-release-job-isolation.py --self-test
          python3 scripts/ci/test-release-job-isolation.py \
            .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/check-workflow-input-boundaries.py --self-test
          python3 scripts/ci/check-workflow-input-boundaries.py .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/check-action-pins.py --self-test
          python3 scripts/ci/check-action-pins.py .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/check-service-enable-policy.py --self-test
          python3 scripts/ci/check-service-enable-policy.py scripts/ci/build-rootfs-image.sh scripts/ci/build-y700-sensor-debs.sh
          python3 scripts/ci/test-safe-extract-archive.py
          python3 -B scripts/ci/test-camera-overlay-verifier.py
          python3 -B scripts/ci/test-camera-plugin-producer.py
          python3 -B scripts/ci/test-libcamera-source-export.py
          python3 -B scripts/ci/test-libcamera-source-materialization.py
          python3 -B scripts/ci/test-libcamera-build-adapter.py
          python3 -B scripts/ci/test-libcamera-build-environment.py
          python3 -B scripts/ci/test-libcamera-environment-preparation.py
          python3 -B scripts/ci/test-libcamera-runtime.py
          python3 -B scripts/ci/test-camera-runtime-dependencies.py
          python3 -B scripts/ci/test-camera-runtime-loader.py
          python3 -B scripts/ci/test-camera-artifact-handoff.py
          python3 -B scripts/ci/test-camera-release-assets.py
          python3 -B scripts/ci/test-camera-source-contract.py \
            source/tb321fu-camera-rootfs-overlay/source/libcamera-source.cpp.clean-minimal-daily
          python3 -B scripts/ci/test-camera-data-loop.py
          bash scripts/ci/test-camera-overlay-installer.sh
          bash scripts/ci/test-input-and-path-boundaries.sh
          bash scripts/ci/test-system-payload-policy.sh
          python3 -IB scripts/ci/test-ssh-host-identity.py
          python3 -IB scripts/ci/test-ssh-image-evidence.py
          python3 -IB scripts/ci/test-ssh-policy-probe.py
          sudo -n python3 -IB scripts/ci/test-stock-tls-identity.py
          bash scripts/ci/test-audio-route-lifecycle.sh
          bash scripts/ci/test-qcom-sns-lifecycle.sh
          bash scripts/ci/test-gpu-deb-lifecycle.sh
          sudo -n bash scripts/ci/test-gpu-chroot-runtime.sh
          bash scripts/ci/test-gpu-provider.sh
          bash scripts/ci/test-openpgp-pin.sh
          bash scripts/ci/test-rootfs-overlay-boundary.sh
          bash scripts/ci/test-apt-provenance.sh
          bash scripts/ci/test-grub-template-policy.sh
          bash scripts/ci/test-release-publication.sh
          bash scripts/ci/test-release-manifest.sh
          python3 -IB scripts/ci/test-stage-large-image.py
          bash scripts/ci/test-release-input-provenance.sh

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y \
            debootstrap dosfstools mtools e2fsprogs rsync curl unzip tar xz-utils zstd p7zip-full \
            gdisk qemu-utils sudo ca-certificates gnupg binutils patch kmod bc \
            device-tree-compiler flex bison m4 build-essential python3-apt \
            meson ninja-build pkg-config protobuf-c-compiler gcc-aarch64-linux-gnu \
            libglib2.0-dev:arm64 libqmi-glib-dev:arm64 libgudev-1.0-dev:arm64 libpolkit-gobject-1-dev:arm64 libprotobuf-c-dev:arm64

      - name: Validate GRUB image integrity
        run: |
          set -euo pipefail
          bash scripts/ci/test-grub-image-integrity.sh

      - name: Validate kernel bootstrap policy
        run: |
          set -euo pipefail
          /usr/bin/python3 -IB scripts/ci/test-hosted-bison-fixture.py
          /usr/bin/python3 -IB scripts/ci/with-hosted-bison-fixture.py -- bash scripts/ci/test-kernel-bootstrap-policy.sh

      - name: Apply workflow configuration
        env:
          INPUT_OUTPUT_PREFIX: ${{ inputs.output_prefix }}
          INPUT_UBUNTU_MIRROR: ${{ inputs.ubuntu_mirror }}
          INPUT_ROOTFS_IMAGE_SIZE: ${{ inputs.rootfs_image_size }}
          INPUT_ROOTFS_LABEL: ${{ inputs.rootfs_label }}
          INPUT_HOSTNAME_NAME: ${{ inputs.hostname_name }}
          INPUT_ROOTFS_CONFIG: ${{ inputs.rootfs_config }}
          INPUT_BOOT_CONFIG: ${{ inputs.boot_config }}
          INPUT_SOURCE_CONFIG: ${{ inputs.source_config }}
        run: |
          set -euo pipefail
          . scripts/ci/common.sh
          ci_validate_single_line "$INPUT_OUTPUT_PREFIX" INPUT_OUTPUT_PREFIX
          ci_validate_single_line "$INPUT_UBUNTU_MIRROR" INPUT_UBUNTU_MIRROR
          ci_validate_single_line "$INPUT_ROOTFS_IMAGE_SIZE" INPUT_ROOTFS_IMAGE_SIZE
          ci_validate_single_line "$INPUT_ROOTFS_LABEL" INPUT_ROOTFS_LABEL
          ci_validate_single_line "$INPUT_HOSTNAME_NAME" INPUT_HOSTNAME_NAME
          ci_validate_output_prefix "$INPUT_OUTPUT_PREFIX"
          ci_validate_https_apt_uri "$INPUT_UBUNTU_MIRROR"
          ci_validate_rootfs_image_size "$INPUT_ROOTFS_IMAGE_SIZE"
          ci_validate_rootfs_label "$INPUT_ROOTFS_LABEL"
          ci_validate_hostname "$INPUT_HOSTNAME_NAME"
          cat > "$RUNNER_TEMP/rootfs.env" <<'CONFIG_EOF'
          DISTRO=resolute
          ARCH=arm64
          DEBOOTSTRAP_VARIANT=
          ROOTFS_UUID=
          ROOTFS_PARTLABEL=userdata
          DEFAULT_USER_NAME=y700
          ROOT_PASSWORD_MODE=locked
          USER_SUDO_MODE=password
          SDDM_AUTOLOGIN=0
          SDDM_AUTOLOGIN_SESSION=plasma
          TZ_REGION=Asia/Shanghai
          LANG_NAME=zh_CN.UTF-8
          PACKAGE_LIST=
          DESKTOP_ENV=kubuntu-desktop
          OVERLAY_ARCHIVE=
          OVERLAY_ARCHIVE_SHA256=
          DEB_ARCHIVE=https://github.com/GUF296/ubuntu-y700-build-ci/releases/download/tb321fu-kernel-bootstrap-11bbf0262857-20261120.1/tb321fu-device-debs-7.1.1-00011-g11bbf0262857.tar.gz
          DEB_ARCHIVE_SHA256=16f905295d9c5644f3621e7c864da0e4653d724a4a8fe189aaaf5d302ce54490
          SENSOR_DEB_ARCHIVE=https://github.com/GUF296/tb321fu-sensor-debs/releases/download/tb321fu-sensor-debs-remediation-20260829.1/tb321fu-sensor-debs_20260829.1_arm64.tar.gz
          SENSOR_DEB_ARCHIVE_SHA256=3829d252d3e15e359cdcbe47fa99e7aa2975b29a98f132c5e04c5dfd936cc5bf
          SENSOR_PRODUCER_COMMIT=7c93f418a2e828fc156e99ac605a9b70bdcbb477
          HAPTICS_DEB_ARCHIVE=https://github.com/GUF296/tb321fu-haptics-debs/releases/download/tb321fu-haptics-debs-20261120.1/tb321fu-haptics-debs_20261120.1_arm64.tar.gz
          HAPTICS_DEB_ARCHIVE_SHA256=86f9529ca06b7cee6f803c1eded3d8f2f64f749f5db825d3ab5b563a8f219210
          HAPTICS_PRODUCER_COMMIT=79ac73d521064fd5192d68e5b0cd778ce385cbe1
          BUILD_TB321FU_CAMERA_STACK=1
          CAMERA_STACK_ARCHIVE=
          CAMERA_STACK_ARCHIVE_SHA256=
          CAMERA_STACK_DIR=
          BUILD_TB321FU_GPU_SENSOR=1
          TB321FU_GPU_SENSOR_SOURCE_DIR=
          TB321FU_GPU_SENSOR_BUILD_JOBS=2
          INSTALL_GNOME_SNAPSHOT=1
          INSTALL_FIREFOX=1
          INSTALL_FCITX5_CHINESE=1
          DISABLE_SNAPD=1
          APPLY_Y700_FIRMWARE_FIXES=1
          APPLY_Y700_AUDIO_POLICY_FIXES=1
          CLEAN_APT_CACHE=1
          COMPRESS=7z
          CHUNK_SIZE=
          KEEP_RAW_IMAGE=0
          CONFIG_EOF
          python3 -I -B scripts/ci/camera-package-policy.py rootfs-default >> "$RUNNER_TEMP/rootfs.env"
          cat > "$RUNNER_TEMP/boot.env" <<'CONFIG_EOF'
          BOOT_TEMPLATE_IMAGE=https://github.com/GUF296/ubuntu-y700-build-ci/releases/download/bootstrap-y700-20260625/y700-verified-grub-template-userdata-20260624-201420.img
          BOOT_TEMPLATE_IMAGE_SHA256=7136020f5c736e13772980af5d22652e71281f34ce3da7b22add928a62ebd194
          BOOT_IMAGE_SIZE=256M
          BOOT_FAT_BITS=32
          BOOT_FAT_LABEL=Y700GRUB
          BOOT_FAT_VOLUME_ID=00000000
          BOOT_SECTOR_SIZE=512
          BOOT_CLUSTER_SECTORS=
          GRUB_TIMEOUT=3
          ROOT_SELECTOR=partlabel
          ROOT_PARTLABEL=userdata
          ROOT_UUID=
          ROOTARGS=
          ROOTARGS_EXTRA=
          STABLEARGS=drm_client_lib.active=none
          BOOT_COMPRESS=7z
          BOOT_CHUNK_SIZE=
          KEEP_BOOT_IMAGE=0
          CONFIG_EOF
          cat > "$RUNNER_TEMP/source.env" <<'CONFIG_EOF'
          KERNEL_ARTIFACT_ARCHIVE=https://github.com/GUF296/ubuntu-y700-build-ci/releases/download/tb321fu-kernel-bootstrap-11bbf0262857-20261120.1/tb321fu-kernel-artifacts-7.1.1-00011-g11bbf0262857.tar.gz
          KERNEL_ARTIFACT_ARCHIVE_SHA256=ab71b3335e8a535a3e7f50dfc2c97f8932c1cddd91ec79a16188be8f08c6ce3b
          KERNEL_BUILD_ARCHIVE=https://github.com/GUF296/ubuntu-y700-build-ci/releases/download/tb321fu-kernel-bootstrap-11bbf0262857-20261120.1/tb321fu-kernel-build-sdk-7.1.1-00011-g11bbf0262857.tar.gz
          KERNEL_BUILD_ARCHIVE_SHA256=0b84cd9bec6c41d7c55c143cd7e945820971e4267aed66728126e6b96f753e87
          KERNEL_BOOTSTRAP_PRODUCER_COMMIT=cbc1b36c37c140271bb688c5b1a79b10e669ba2c
          KERNEL_BOOTSTRAP_PRODUCER_TREE=0d84ed4c3d8cd13b70624e47800ae932cb80acac
          KERNEL_BOOTSTRAP_PRODUCER_TREE_SHA256=f554dc63a60a8a5c31f7acac67ca654596d7ff006cdb6845be940e03ac0c3e90
          BOOTAA64_EFI_URL=
          BOOTAA64_EFI_SHA256=
          QCOMRAMP_EFI_URL=
          QCOMRAMP_EFI_SHA256=
          QCOMRAMP_CFG_NAME=qcomramp.cfg
          GRUB_BUILD_ARCHIVE=
          GRUB_BUILD_ARCHIVE_SHA256=
          HAPTICS_MODULE_SHA256=d40eb19660ff26c937ed0062a599bed0321cafb89d347610b519983512014a77
          HAPTICS_HELPER_BINARY_SHA256=f4b36b63ff54c0e2f3fa3568debc1844b1d8c77c9ed710f622d3e8b9be4365ce
          DTB_NAME=sm8650-lenovo-tb321fu.dtb
          CONFIG_EOF
          sed -i 's/^          //' "$RUNNER_TEMP/rootfs.env" "$RUNNER_TEMP/boot.env" "$RUNNER_TEMP/source.env"
          append_optional_config() {
            local config_file=$1
            local config_input=$2
            [ -n "$config_input" ] || return 0
            printf '\n%s\n' "$config_input" >> "$config_file"
          }
          append_optional_config "$RUNNER_TEMP/rootfs.env" "$INPUT_ROOTFS_CONFIG"
          append_optional_config "$RUNNER_TEMP/boot.env" "$INPUT_BOOT_CONFIG"
          append_optional_config "$RUNNER_TEMP/source.env" "$INPUT_SOURCE_CONFIG"
          {
            printf 'MIRROR=%s\n' "$INPUT_UBUNTU_MIRROR"
            printf 'ROOTFS_IMAGE_SIZE=%s\n' "$INPUT_ROOTFS_IMAGE_SIZE"
            printf 'ROOTFS_LABEL=%s\n' "$INPUT_ROOTFS_LABEL"
            printf 'HOSTNAME_NAME=%s\n' "$INPUT_HOSTNAME_NAME"
          } >> "$RUNNER_TEMP/rootfs.env"
          config_notes_dir="$RUNNER_TEMP/build-config-notes"
          mkdir -p "$config_notes_dir"
          scripts/ci/apply-workflow-config.sh "$RUNNER_TEMP/rootfs.env" \
            "$config_notes_dir/rootfs.env"
          scripts/ci/apply-workflow-config.sh "$RUNNER_TEMP/boot.env" \
            "$config_notes_dir/boot.env"
          scripts/ci/apply-workflow-config.sh "$RUNNER_TEMP/source.env" \
            "$config_notes_dir/source.env"
          {
            echo 'OUTPUT_DIR_ROOTFS=out/ci-rootfs'
            echo 'OUTPUT_DIR_GRUB=out/ci-grub'
            echo "BUILD_CONFIG_NOTES_DIR=$config_notes_dir"
            printf 'OUTPUT_PREFIX=%s\n' "$INPUT_OUTPUT_PREFIX"
          } >> "$GITHUB_ENV"

      - name: Verify kernel bundle handoff
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ] && [ "$PRERELEASE" != 1 ]; then
            echo 'Remediation releases must set prerelease=true.' >&2
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ] && { [ -n "${DEB_DIR:-}" ] || [ -n "${HAPTICS_DEB_DIR:-}" ] || [ -n "${SENSOR_DEB_DIR:-}" ] || [ -z "${DEB_ARCHIVE:-}" ] || [ -z "${DEB_ARCHIVE_SHA256:-}" ] || [ -z "${HAPTICS_DEB_ARCHIVE:-}" ] || [ -z "${HAPTICS_DEB_ARCHIVE_SHA256:-}" ]; }; then
            echo 'Tagged releases require pinned DEB_ARCHIVE/HAPTICS_DEB_ARCHIVE inputs; local DEB_DIR, SENSOR_DEB_DIR, and HAPTICS_DEB_DIR are artifact-only.' >&2
            exit 1
          fi
          verified_dir="$RUNNER_TEMP/tb321fu-verified-kernel-bundle"
          RELEASE_TAG="$RELEASE_TAG" \
            bash scripts/ci/validate-release-input-provenance.sh
          env \
            OUTPUT_DIR="$verified_dir" \
            KERNEL_ARTIFACT_ARCHIVE="$KERNEL_ARTIFACT_ARCHIVE" \
            KERNEL_ARTIFACT_ARCHIVE_SHA256="$KERNEL_ARTIFACT_ARCHIVE_SHA256" \
            KERNEL_BUILD_ARCHIVE="$KERNEL_BUILD_ARCHIVE" \
            KERNEL_BUILD_ARCHIVE_SHA256="$KERNEL_BUILD_ARCHIVE_SHA256" \
            KERNEL_BOOTSTRAP_PRODUCER_COMMIT="$KERNEL_BOOTSTRAP_PRODUCER_COMMIT" \
            KERNEL_BOOTSTRAP_PRODUCER_TREE="$KERNEL_BOOTSTRAP_PRODUCER_TREE" \
            KERNEL_BOOTSTRAP_PRODUCER_TREE_SHA256="$KERNEL_BOOTSTRAP_PRODUCER_TREE_SHA256" \
            DEB_ARCHIVE="$DEB_ARCHIVE" \
            DEB_ARCHIVE_SHA256="$DEB_ARCHIVE_SHA256" \
            SENSOR_DEB_ARCHIVE="$SENSOR_DEB_ARCHIVE" \
            SENSOR_DEB_ARCHIVE_SHA256="$SENSOR_DEB_ARCHIVE_SHA256" \
            EXPECTED_SENSOR_PRODUCER_COMMIT="$SENSOR_PRODUCER_COMMIT" \
            HAPTICS_DEB_ARCHIVE="$HAPTICS_DEB_ARCHIVE" \
            HAPTICS_DEB_ARCHIVE_SHA256="$HAPTICS_DEB_ARCHIVE_SHA256" \
            EXPECTED_HAPTICS_PRODUCER_COMMIT="$HAPTICS_PRODUCER_COMMIT" \
            EXPECTED_HAPTICS_MODULE_SHA256="$HAPTICS_MODULE_SHA256" \
            EXPECTED_HAPTICS_HELPER_BINARY_SHA256="$HAPTICS_HELPER_BINARY_SHA256" \
            DTB_NAME="$DTB_NAME" \
            bash scripts/ci/verify-kernel-bundle.sh
          cat "$verified_dir/verified.env" >> "$GITHUB_ENV"
          install -m 0644 "$verified_dir/VERIFIED-INPUTS.tsv" \
            "${BUILD_CONFIG_NOTES_DIR:?}/verified-inputs.tsv"

      - name: Prepare GRUB build input
        run: |
          set -euo pipefail
          boot_template="${BOOT_TEMPLATE_IMAGE:-${BOOT_TEMPLATE_IMAGE_URL:-}}"
          if [ -n "${BOOT_TEMPLATE_IMAGE:-}" ] && [ -n "${BOOT_TEMPLATE_IMAGE_URL:-}" ]; then
            echo 'BOOT_TEMPLATE_IMAGE and BOOT_TEMPLATE_IMAGE_URL are mutually exclusive.' >&2
            exit 1
          fi
          if [ -n "${GRUB_BUILD_ARCHIVE:-}" ] && {
            [ -n "$boot_template" ] ||
            [ -n "${QCOMRAMP_EFI:-}" ] ||
            [ -n "${QCOMRAMP_EFI_URL:-}" ];
          }; then
            echo 'GRUB_BUILD_ARCHIVE cannot be combined with a template or prebuilt QCOMRAMP EFI.' >&2
            exit 1
          fi
          if [ -n "${QCOMRAMP_EFI:-}" ] && [ -n "${QCOMRAMP_EFI_URL:-}" ]; then
            echo 'QCOMRAMP_EFI and QCOMRAMP_EFI_URL are mutually exclusive.' >&2
            exit 1
          fi
          if [ -n "${GRUB_BUILD_ARCHIVE:-}" ]; then
            mkdir -p "$RUNNER_TEMP/grub-build"
            . scripts/ci/common.sh
            ci_download "$GRUB_BUILD_ARCHIVE" "$RUNNER_TEMP/grub-build.tar" \
              "${GRUB_BUILD_ARCHIVE_SHA256:-}"
            python3 scripts/ci/safe-extract-archive.py \
              "$RUNNER_TEMP/grub-build.tar" "$RUNNER_TEMP/grub-build"
            mapfile -d '' -t grub_candidates < <(
              find "$RUNNER_TEMP/grub-build" -xdev -type f -name grub-mkstandalone -perm -u+x -print0 | sort -z
            )
            [ "${#grub_candidates[@]}" -eq 1 ] || {
              echo 'GRUB build archive must contain exactly one executable grub-mkstandalone.' >&2
              exit 1
            }
            found=${grub_candidates[0]}
            [ -x "$found" ] || {
              echo "GRUB build candidate is not executable: $found" >&2
              exit 1
            }
            echo "Y700_GRUB_BUILD_DIR=$(dirname "$found")" >> "$GITHUB_ENV"
          elif [ -n "${QCOMRAMP_EFI_URL:-}" ]; then
            echo 'Y700_GRUB_BUILD_DIR=' >> "$GITHUB_ENV"
            echo 'Using prebuilt QCOMRAMP_EFI_URL; skipping grub-mkstandalone input.'
          elif [ -n "${QCOMRAMP_EFI:-}" ]; then
            if [ ! -f "$QCOMRAMP_EFI" ] || [ -L "$QCOMRAMP_EFI" ]; then
              echo 'QCOMRAMP_EFI must be a regular non-symlink file.' >&2
              exit 1
            fi
            echo 'Y700_GRUB_BUILD_DIR=' >> "$GITHUB_ENV"
            echo 'Using prebuilt local QCOMRAMP_EFI; skipping grub-mkstandalone input.'
          elif [ -n "${BOOT_TEMPLATE_IMAGE:-}" ] || [ -n "${BOOT_TEMPLATE_IMAGE_URL:-}" ]; then
            echo 'Y700_GRUB_BUILD_DIR=' >> "$GITHUB_ENV"
            echo 'Using BOOT_TEMPLATE_IMAGE; preserving verified GRUB/EFI template.'
          else
            echo 'Either GRUB_BUILD_ARCHIVE, QCOMRAMP_EFI_URL, or BOOT_TEMPLATE_IMAGE must be set.' >&2
            exit 1
          fi

      - name: Download camera artifact handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.camera-producer.outputs.artifact_id }}
          path: out/tb321fu-camera-stack-debs
          merge-multiple: true

      - name: Verify camera artifact handoff
        env:
          CAMERA_ARTIFACT_ID: ${{ needs.camera-producer.outputs.artifact_id }}
          CAMERA_ARTIFACT_DIGEST: ${{ needs.camera-producer.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ $CAMERA_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]] || {
            echo 'camera producer artifact id is missing or malformed' >&2
            exit 1
          }
          [[ $CAMERA_ARTIFACT_DIGEST =~ ^[0-9a-f]{64}$ ]] || {
            echo 'camera producer artifact digest is missing or malformed' >&2
            exit 1
          }
          handoff_args=(
            --enabled="${BUILD_TB321FU_CAMERA_STACK:-}"
            --arch="${ARCH:-arm64}"
            --version="${CAMERA_STACK_DEB_VERSION:?camera version was not configured}"
            --repository="$GITHUB_REPOSITORY"
            --commit="$GITHUB_SHA"
            --run-id="$GITHUB_RUN_ID"
            --run-attempt="$GITHUB_RUN_ATTEMPT"
            --source-archive="${CAMERA_STACK_ARCHIVE:-}"
            --source-archive-sha256="${CAMERA_STACK_ARCHIVE_SHA256:-}"
            --source-directory="${CAMERA_STACK_DIR:-}"
          )
          verified_camera_deb_sha256=$(python3 -B scripts/ci/camera-artifact-handoff.py verify \
            out/tb321fu-camera-stack-debs "${handoff_args[@]}" --print-deb-sha256)
          {
            printf 'TB321FU_VERIFIED_CAMERA_DEB_SHA256=%s\n' "$verified_camera_deb_sha256"
            printf 'CAMERA_PRODUCER_ARTIFACT_ID=%s\n' "$CAMERA_ARTIFACT_ID"
            printf 'CAMERA_PRODUCER_ARTIFACT_DIGEST=%s\n' "$CAMERA_ARTIFACT_DIGEST"
          } >> "$GITHUB_ENV"
          if [ "${BUILD_TB321FU_CAMERA_STACK:-}" != 1 ]; then
            echo 'TB321FU_CAMERA_STACK_DEB_DIR=' >> "$GITHUB_ENV"
            exit 0
          fi
          . scripts/ci/system-payload-policy.sh
          camera_deb="out/tb321fu-camera-stack-debs/tb321fu-camera-stack_${CAMERA_STACK_DEB_VERSION:?camera version was not configured}_${ARCH:-arm64}.deb"
          camera_policy_stage="$RUNNER_TEMP/camera-handoff-policy"
          ci_assert_tb321fu_camera_stack_deb "$camera_deb" "$camera_policy_stage"
          . scripts/ci/common.sh
          ci_safe_rmtree "$camera_policy_stage" "$RUNNER_TEMP" camera-handoff-policy
          echo 'TB321FU_CAMERA_STACK_DEB_DIR=out/tb321fu-camera-stack-debs' >> "$GITHUB_ENV"

      - name: Build rootfs image
        env:
          DEFAULT_USER_PASSWORD_HASH: ${{ secrets.TB321FU_NOV2026_TEST_USER_PASSWORD_HASH }}
          DEFAULT_USER_AUTHORIZED_KEYS: ${{ secrets.DEFAULT_USER_AUTHORIZED_KEYS }}
          ROOT_PASSWORD_HASH: ${{ secrets.ROOT_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          sensor_deb_dir="${SENSOR_DEB_DIR:-}"
          haptics_deb_dir="${HAPTICS_DEB_DIR:-}"
          if [ -n "${VERIFIED_KERNEL_BUNDLE_DIR:-}" ]; then
            [ -n "${SENSOR_DEB_ARCHIVE:-}" ] || {
              echo 'Verified handoff is missing its staged sensor archive.' >&2
              exit 1
            }
            sensor_deb_dir=
            if [ -n "${HAPTICS_DEB_ARCHIVE:-}" ]; then
              haptics_deb_dir=
            elif [ -n "${HAPTICS_DEB_DIR:-}" ]; then
              haptics_deb_dir="$HAPTICS_DEB_DIR"
            else
              echo 'Verified handoff is missing its staged haptics input.' >&2
              exit 1
            fi
          fi
          sudo --preserve-env=OUTPUT_PREFIX,DISTRO,ARCH,MIRROR,DEBOOTSTRAP_VARIANT,RESOLV_CONF_CONTENT,APT_HTTP_PROXY,APT_HTTPS_PROXY,http_proxy,https_proxy,HTTP_PROXY,HTTPS_PROXY,APT_SOURCES_LIST,ROOTFS_IMAGE_SIZE,ROOTFS_UUID,ROOTFS_LABEL,ROOTFS_PARTLABEL,HOSTNAME_NAME,DEFAULT_USER_NAME,DEFAULT_USER_PASSWORD_HASH,DEFAULT_USER_AUTHORIZED_KEYS,ROOT_PASSWORD_MODE,ROOT_PASSWORD_HASH,USER_SUDO_MODE,SDDM_AUTOLOGIN,SDDM_AUTOLOGIN_SESSION,TZ_REGION,LOCALES,LANG_NAME,PACKAGE_LIST,DESKTOP_ENV,OVERLAY_ARCHIVE,OVERLAY_ARCHIVE_SHA256,DEB_ARCHIVE,DEB_ARCHIVE_SHA256,DEB_DIR,SENSOR_DEB_ARCHIVE,SENSOR_DEB_ARCHIVE_SHA256,SENSOR_DEB_DIR,HAPTICS_DEB_ARCHIVE,HAPTICS_DEB_ARCHIVE_SHA256,HAPTICS_DEB_DIR,CAMERA_STACK_DEB_DIR,BUILD_TB321FU_GPU_SENSOR,TB321FU_GPU_SENSOR_SOURCE_DIR,TB321FU_GPU_SENSOR_BUILD_JOBS,INSTALL_GNOME_SNAPSHOT,INSTALL_FIREFOX,INSTALL_FCITX5_CHINESE,FCITX5_CHINESE_PACKAGES,DISABLE_SNAPD,APPLY_Y700_FIRMWARE_FIXES,APPLY_Y700_AUDIO_POLICY_FIXES,CLEAN_APT_CACHE,COMPRESS,CHUNK_SIZE,KEEP_RAW_IMAGE \
            env OUTPUT_DIR="$OUTPUT_DIR_ROOTFS" SENSOR_DEB_DIR="$sensor_deb_dir" HAPTICS_DEB_DIR="$haptics_deb_dir" CAMERA_STACK_DEB_DIR="${TB321FU_CAMERA_STACK_DEB_DIR:-}" \
              CAMERA_STACK_DEB_EXPECTED_SHA256="${TB321FU_VERIFIED_CAMERA_DEB_SHA256:-}" bash scripts/ci/build-rootfs-image.sh
          sudo chown -R "$USER:$USER" out

      - name: Build GRUB boot image
        run: |
          set -euo pipefail
          env OUTPUT_DIR="$OUTPUT_DIR_GRUB" \
            OUTPUT_PREFIX="$OUTPUT_PREFIX" \
            BOOT_TEMPLATE_IMAGE="${BOOT_TEMPLATE_IMAGE:-}" \
            BOOT_TEMPLATE_IMAGE_URL="${BOOT_TEMPLATE_IMAGE_URL:-}" \
            BOOT_TEMPLATE_IMAGE_SHA256="${BOOT_TEMPLATE_IMAGE_SHA256:-}" \
            BOOT_IMAGE_SIZE="$BOOT_IMAGE_SIZE" \
            BOOT_FAT_BITS="$BOOT_FAT_BITS" \
            BOOT_FAT_LABEL="$BOOT_FAT_LABEL" \
            BOOT_FAT_VOLUME_ID="${BOOT_FAT_VOLUME_ID:-00000000}" \
            BOOT_SECTOR_SIZE="$BOOT_SECTOR_SIZE" \
            BOOT_CLUSTER_SECTORS="$BOOT_CLUSTER_SECTORS" \
            GRUB_TIMEOUT="${GRUB_TIMEOUT:-3}" \
            KERNEL_ARTIFACT_ARCHIVE="$KERNEL_ARTIFACT_ARCHIVE" \
            KERNEL_ARTIFACT_ARCHIVE_SHA256="${KERNEL_ARTIFACT_ARCHIVE_SHA256:-}" \
            BOOTAA64_EFI_URL="$BOOTAA64_EFI_URL" \
            BOOTAA64_EFI_SHA256="${BOOTAA64_EFI_SHA256:-}" \
            BOOTAA64_EFI="${BOOTAA64_EFI:-}" \
            QCOMRAMP_EFI="${QCOMRAMP_EFI:-}" \
            QCOMRAMP_EFI_URL="$QCOMRAMP_EFI_URL" \
            QCOMRAMP_EFI_SHA256="${QCOMRAMP_EFI_SHA256:-}" \
            QCOMRAMP_CFG_NAME="$QCOMRAMP_CFG_NAME" \
            DTB_NAME="$DTB_NAME" \
            ROOT_SELECTOR="$ROOT_SELECTOR" \
            ROOT_PARTLABEL="$ROOT_PARTLABEL" \
            ROOT_UUID="$ROOT_UUID" \
            ROOTARGS="$ROOTARGS" \
            ROOTARGS_EXTRA="$ROOTARGS_EXTRA" \
            STABLEARGS="$STABLEARGS" \
            BOOT_COMPRESS="$BOOT_COMPRESS" \
            BOOT_CHUNK_SIZE="$BOOT_CHUNK_SIZE" \
            KEEP_BOOT_IMAGE="$KEEP_BOOT_IMAGE" \
            Y700_GRUB_BUILD_DIR="$Y700_GRUB_BUILD_DIR" \
            bash scripts/ci/build-grub-image.sh

      - name: Write combined checksums
        run: |
          set -euo pipefail
          mkdir -p out/ci-release
          install -m 0644 "${VERIFIED_KERNEL_BUNDLE_DIR:?}/KERNEL-BUNDLE.tsv" \
            out/ci-release/KERNEL-BUNDLE.tsv
          install -m 0644 "$VERIFIED_KERNEL_BUNDLE_DIR/VERIFIED-BUNDLE.tsv" \
            out/ci-release/VERIFIED-BUNDLE.tsv
          install -m 0644 "$VERIFIED_KERNEL_BUNDLE_DIR/VERIFIED-INPUTS.tsv" \
            out/ci-release/VERIFIED-INPUTS.tsv
          install -m 0644 "$OUTPUT_DIR_ROOTFS/${OUTPUT_PREFIX}-rootfs.apt-bootstrap.tsv" \
            out/ci-release/APT-BOOTSTRAP.tsv
          install -m 0644 out/tb321fu-camera-stack-debs/CAMERA-HANDOFF.tsv \
            out/ci-release/CAMERA-HANDOFF.tsv
          checksum_dirs=("$OUTPUT_DIR_ROOTFS" "$OUTPUT_DIR_GRUB")
          if [ -d out/y700-sensor-debs ]; then
            checksum_dirs+=(out/y700-sensor-debs)
          fi
          if [ -d out/tb321fu-haptics-debs ]; then
            checksum_dirs+=(out/tb321fu-haptics-debs)
          fi
          if [ -d out/tb321fu-camera-stack-debs ]; then
            checksum_dirs+=(out/tb321fu-camera-stack-debs)
          fi
          bash scripts/ci/write-portable-checksums.sh \
            out/ci-release/SHA256SUMS.txt "${checksum_dirs[@]}" \
            out/ci-release/KERNEL-BUNDLE.tsv \
            out/ci-release/VERIFIED-BUNDLE.tsv \
            out/ci-release/VERIFIED-INPUTS.tsv \
            out/ci-release/APT-BOOTSTRAP.tsv

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.output_prefix }}-rootfs-grub
          path: |
            out/ci-rootfs/*
            out/ci-grub/*
            out/y700-sensor-debs/*
            out/tb321fu-haptics-debs/*
            out/tb321fu-camera-stack-debs/*
            out/ci-release/*.tsv
            out/ci-release/SHA256SUMS.txt

      - name: Upload release assets
        if: ${{ inputs.release_tag != '' }}
        run: |
          set -euo pipefail
          release_stage=out/ci-release/release-staging
          release_dir="$release_stage/assets"
          assert_no_symlink_component() {
            local path=$1 current
            case "$path" in
              /*) current=$path ;;
              *) current=$PWD/$path ;;
            esac
            while :; do
              [ ! -L "$current" ] || {
                echo "release staging path contains a symlink component: $current" >&2
                exit 1
              }
              [ "$current" = / ] && break
              current=$(dirname -- "$current")
              [ -n "$current" ] || current=/
            done
          }
          mkdir -p out out/ci-release
          assert_no_symlink_component out
          assert_no_symlink_component out/ci-release
          [ ! -L "$release_stage" ] || {
            echo 'release staging root must not be an existing symlink' >&2
            exit 1
          }
          [ "$release_stage" = out/ci-release/release-staging ] || {
            echo "refusing unbounded release staging cleanup: $release_dir" >&2
            exit 1
          }
          assert_no_symlink_component "$release_stage"
          assert_no_symlink_component "$release_dir"
          rm -rf "$release_stage"
          mkdir -p "$release_dir"

          stage_release_file() {
            local source=$1
            local destination=$2

            assert_no_symlink_component "$source"
            assert_no_symlink_component "$destination"
            [ ! -L "$source" ] || {
              echo "release staging source must not be a symlink: $source" >&2
              exit 1
            }
            [ -f "$source" ] || {
              echo "release staging source is not a regular file: $source" >&2
              exit 1
            }
            install -m 0644 -- "$source" "$destination"
          }

          select_release_asset() {
            local source_dir=$1
            local source_prefix=$2
            local release_name=$3
            local compress=$4
            local chunk_size=$5
            local suffix src dest

            case "$compress" in
              none) suffix=.img; src="$source_dir/$source_prefix" ;;
              zstd) suffix=.img.zst; src="$source_dir/$source_prefix.zst" ;;
              xz) suffix=.img.xz; src="$source_dir/$source_prefix.xz" ;;
              7z)
                if [ -n "$chunk_size" ]; then
                  echo "Release upload expects a single $release_name archive; clear CHUNK_SIZE/BOOT_CHUNK_SIZE instead of using 7z volumes." >&2
                  exit 1
                fi
                suffix=.img.7z
                src="$source_dir/$source_prefix.7z"
                ;;
              *) echo "unsupported $release_name compression: $compress" >&2; exit 1 ;;
            esac

            dest="$release_dir/${release_name}${suffix}"
            if [ "$compress" = 7z ] && [ "$(stat -c %s -- "$src")" -gt 1992294400 ]; then
              # Split the verified archive itself: no second full staged
              # copy while the numbered parts are being produced.
              assert_no_symlink_component "$src"
              assert_no_symlink_component "$dest"
              python3 -IB scripts/ci/stage-large-image.py "$src" "$dest" \
                "$source_dir/${source_prefix%.img}.SHA256SUMS"
            else
              stage_release_file "$src" "$dest"
            fi
          }

          select_release_asset "$OUTPUT_DIR_ROOTFS" "${OUTPUT_PREFIX}-rootfs.img" rootfs "${COMPRESS:-7z}" "${CHUNK_SIZE:-}"
          select_release_asset "$OUTPUT_DIR_GRUB" "${OUTPUT_PREFIX}-grub-fat.img" grub "${BOOT_COMPRESS:-7z}" "${BOOT_CHUNK_SIZE:-}"
          stage_release_file source/boot-image/boot.img.7z "$release_dir/boot.img.7z"
          stage_release_file "${VERIFIED_KERNEL_BUNDLE_DIR:?}/KERNEL-BUNDLE.tsv" \
            "$release_dir/KERNEL-BUNDLE.tsv"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/VERIFIED-BUNDLE.tsv" \
            "$release_dir/VERIFIED-BUNDLE.tsv"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/VERIFIED-INPUTS.tsv" \
            "$release_dir/VERIFIED-INPUTS.tsv"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/KERNEL-SOURCE-LOCK.tsv" \
            "$release_dir/KERNEL-SOURCE-LOCK.tsv"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/SENSOR-SOURCE-LOCK.tsv" \
            "$release_dir/SENSOR-SOURCE-LOCK.tsv"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/HAPTICS-SOURCE-LOCK.tsv" \
            "$release_dir/HAPTICS-SOURCE-LOCK.tsv"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/HAPTICS-BUILD-TOOLS.tsv" \
            "$release_dir/HAPTICS-BUILD-TOOLS.tsv"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/MODULES.sha256" \
            "$release_dir/MODULES.sha256"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/KERNEL-SDK-MANIFEST.tsv" \
            "$release_dir/KERNEL-SDK-MANIFEST.tsv"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/KERNEL-TOOLCHAIN.tsv" \
            "$release_dir/KERNEL-TOOLCHAIN.tsv"
          stage_release_file "$VERIFIED_KERNEL_BUNDLE_DIR/KBUILD-FLAGS.tsv" \
            "$release_dir/KBUILD-FLAGS.tsv"
          stage_release_file out/tb321fu-camera-stack-debs/CAMERA-HANDOFF.tsv \
            "$release_dir/CAMERA-HANDOFF.tsv"
          stage_release_file out/tb321fu-camera-stack-debs/tb321fu-camera-stack-build-report.txt \
            "$release_dir/CAMERA-BUILD-REPORT.txt"
          camera_release_deb=$(python3 -I -B scripts/ci/camera-package-policy.py deb-name)
          stage_release_file "out/tb321fu-camera-stack-debs/$camera_release_deb" \
            "$release_dir/$camera_release_deb"
          stage_release_file out/tb321fu-camera-stack-debs/SHA256SUMS-tb321fu-camera-stack-debs.txt \
            "$release_dir/SHA256SUMS-tb321fu-camera-stack-debs.txt"
          python3 -I -B scripts/ci/verify-camera-release-assets.py "$release_dir" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          stage_release_file "$OUTPUT_DIR_ROOTFS/${OUTPUT_PREFIX}-rootfs.packages.tsv" \
            "$release_dir/ROOTFS-PACKAGES.tsv"
          stage_release_file "$OUTPUT_DIR_ROOTFS/${OUTPUT_PREFIX}-rootfs.apt-provenance.tsv" \
            "$release_dir/APT-PROVENANCE.tsv"
          stage_release_file "$OUTPUT_DIR_ROOTFS/${OUTPUT_PREFIX}-rootfs.apt-bootstrap.tsv" \
            "$release_dir/APT-BOOTSTRAP.tsv"
          stage_release_file "$OUTPUT_DIR_ROOTFS/${OUTPUT_PREFIX}-rootfs.apt-sources.txt" \
            "$release_dir/APT-SOURCES.txt"

          split_large_release_assets() {
            local max_bytes=1992294400
            local asset size

            while IFS= read -r -d '' asset; do
              size=$(stat -c '%s' "$asset")
              if [ "$size" -le "$max_bytes" ]; then
                continue
              fi
              echo "Splitting release asset larger than GitHub's 2GB limit: $asset ($size bytes)"
              split -b 1900M -d -a 3 "$asset" "$asset."
              rm -f "$asset"
            done < <(find "$release_dir" -maxdepth 1 -type f -print0)
          }

          notes="$release_dir/BUILD-PARAMETERS.md"
          rootfs_notes=out/ci-release/rootfs-config-for-notes.txt
          boot_notes=out/ci-release/boot-config-for-notes.txt
          source_notes=out/ci-release/source-config-for-notes.txt
          verified_inputs_notes=out/ci-release/verified-inputs-for-notes.tsv
          cp "${BUILD_CONFIG_NOTES_DIR:?}/rootfs.env" "$rootfs_notes"
          cp "${BUILD_CONFIG_NOTES_DIR:?}/boot.env" "$boot_notes"
          cp "${BUILD_CONFIG_NOTES_DIR:?}/source.env" "$source_notes"
          cp "${BUILD_CONFIG_NOTES_DIR:?}/verified-inputs.tsv" "$verified_inputs_notes"
          rootfs_stream_name=rootfs.img
          case "${COMPRESS:-7z}" in
            none) rootfs_stream_name=rootfs.img ;;
            zstd) rootfs_stream_name=rootfs.img.zst ;;
            xz) rootfs_stream_name=rootfs.img.xz ;;
            7z) rootfs_stream_name=rootfs.img.7z ;;
          esac
          grub_stream_name=grub.img
          case "${BOOT_COMPRESS:-7z}" in
            none) grub_stream_name=grub.img ;;
            zstd) grub_stream_name=grub.img.zst ;;
            xz) grub_stream_name=grub.img.xz ;;
            7z) grub_stream_name=grub.img.7z ;;
          esac
          {
            echo '# Build Parameters'
            echo
            echo "- Output prefix: \`$OUTPUT_PREFIX\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Camera producer artifact ID: \`$CAMERA_PRODUCER_ARTIFACT_ID\`"
            echo "- Camera producer artifact SHA-256: \`$CAMERA_PRODUCER_ARTIFACT_DIGEST\`"
            echo "- Generated: \`$(date -u -Iseconds)\`"
            echo
            echo 'Password hashes are supplied only through step-scoped secrets and are never serialized into build configuration or release notes.'
            echo 'If using a shared test account, keep first boot offline or on an isolated network and change its password locally with passwd before joining a trusted LAN.'
            # Markdown code spans are literal characters in the generated notes.
            # shellcheck disable=SC2016
            printf 'Release image streams: `%s` and `%s`; large streams may have contiguous `.NNN` parts.\n' "$rootfs_stream_name" "$grub_stream_name"
            # shellcheck disable=SC2016
            echo 'Assets ending in `.NNN` are split only to satisfy the GitHub Release 2GB per-asset limit. Recombine each stream in lexical order before extraction.'
            echo
            echo '## rootfs_config'
            echo '```text'
            cat "$rootfs_notes"
            echo '```'
            echo
            echo '## boot_config'
            echo '```text'
            cat "$boot_notes"
            echo '```'
            echo
            echo '## source_config'
            echo '```text'
            cat "$source_notes"
            echo '```'
            echo
            echo '## SSH host identity evidence'
            echo '```json'
            python3 -IB scripts/ci/ssh-image-evidence.py bind \
              "$OUTPUT_DIR_ROOTFS/${OUTPUT_PREFIX}-rootfs.ssh-identity.json" \
              "$OUTPUT_DIR_ROOTFS/${OUTPUT_PREFIX}-rootfs.SHA256SUMS" \
              "${OUTPUT_PREFIX}-$rootfs_stream_name"
            echo '```'
            echo
            echo '## Verified bootstrap inputs'
            echo '```text'
            cat "$verified_inputs_notes"
            echo '```'
          } > "$notes"

          split_large_release_assets
          bash scripts/ci/validate-release-staging.sh "$release_stage"
          bash scripts/ci/write-release-manifest.sh "$release_stage"
          bash scripts/ci/validate-release-staging.sh "$release_stage"

      - name: Upload staged release payload
        if: ${{ inputs.release_tag != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ci-release/release-staging
          if-no-files-found: error

  publish:
    if: ${{ inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download staged release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-staging

      - name: Create verified prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || {
            echo 'checked-out source does not match the workflow commit' >&2
            exit 1
          }
          release_stage=$(pwd -P)/release-staging
          assert_no_symlink_component() {
            local current=$1
            while :; do
              [ ! -L "$current" ] || {
                echo "downloaded release staging path contains a symlink component: $current" >&2
                exit 1
              }
              [ "$current" = / ] && break
              current=$(dirname -- "$current")
              [ -n "$current" ] || current=/
            done
          }
          assert_no_symlink_component "$release_stage"
          [ ! -L "$release_stage" ] || {
            echo 'downloaded release staging root must not be a symlink' >&2
            exit 1
          }
          [ -d "$release_stage" ] || {
            echo 'downloaded release staging root is missing' >&2
            exit 1
          }
          [ "$(realpath -e -- "$release_stage")" = "$release_stage" ] || {
            echo 'downloaded release staging root escaped the workspace' >&2
            exit 1
          }
          bash scripts/ci/validate-release-staging.sh "$release_stage"
          bash scripts/ci/publish-release.sh "$RELEASE_TAG" "$release_stage"
