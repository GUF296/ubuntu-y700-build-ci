name: Build RootFS And GRUB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要创建或更新的 Release 标签；留空只生成 Actions artifact，不上传 Release。
        required: false
        type: string
      prerelease:
        description: 将非空 release_tag 发布为 prerelease，并且不设为 latest。
        required: true
        default: false
        type: boolean
      output_prefix:
        description: 输出文件名前缀；会用于 rootfs、grub 和 artifact 名称。
        required: true
        default: y700-kubuntu2604-arm64
        type: string
      ubuntu_mirror:
        description: Ubuntu 软件源地址；arm64 设备应使用 ports.ubuntu.com/ubuntu-ports。
        required: true
        default: http://ports.ubuntu.com/ubuntu-ports
        type: choice
        options:
          - http://ports.ubuntu.com/ubuntu-ports
      rootfs_image_size:
        description: rootfs ext4 镜像大小；可手填如 20G、24G、32768M，过小可能导致桌面环境安装失败。
        required: true
        default: 20G
        type: string
      rootfs_label:
        description: rootfs 文件系统卷标；只是 ext4 label，不决定刷入分区。
        required: true
        default: Ubuntu
        type: string
      hostname_name:
        description: 系统主机名；安装后会写入 /etc/hostname。
        required: true
        default: y700
        type: string
      rootfs_config:
        description: 可选高级 rootfs 覆盖配置，按 KEY=value 每行填写；不填则使用内置默认配置，常用选项已单独列出并会覆盖同名 KEY。
        required: false
        type: string
        default: ""
      boot_config:
        description: 可选高级 GRUB/FAT 启动镜像覆盖配置，按 KEY=value 每行填写；不填则使用内置默认配置，常用选项已单独列出并会覆盖同名 KEY。
        required: false
        type: string
        default: ""
      source_config:
        description: 可选高级源码/启动组件覆盖配置，按 KEY=value 每行填写；通常无需修改，不填则使用内置默认配置。
        required: false
        type: string
        default: ""

concurrency:
  group: release-${{ github.repository }}-${{ inputs.release_tag != '' && inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate workflow input boundaries
        run: |
          bash scripts/ci/run-actionlint.sh .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/test-workflow-semantics.py --self-test
          python3 scripts/ci/test-workflow-semantics.py \
            .github/workflows/build-rootfs-and-grub.yml \
            scripts/ci/build-rootfs-image.sh \
            scripts/ci/apply-workflow-config.sh
          python3 scripts/ci/check-workflow-input-boundaries.py --self-test
          python3 scripts/ci/check-workflow-input-boundaries.py .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/check-action-pins.py --self-test
          python3 scripts/ci/check-action-pins.py .github/workflows/build-rootfs-and-grub.yml
          python3 scripts/ci/check-service-enable-policy.py --self-test
          python3 scripts/ci/check-service-enable-policy.py scripts/ci/build-rootfs-image.sh scripts/ci/build-y700-sensor-debs.sh scripts/ci/build-tb321fu-haptics-deb.sh
          python3 scripts/ci/test-safe-extract-archive.py
          bash scripts/ci/test-input-and-path-boundaries.sh
          bash scripts/ci/test-system-payload-policy.sh
          bash scripts/ci/test-audio-haptics-lifecycle.sh
          bash scripts/ci/test-qcom-sns-lifecycle.sh
          bash scripts/ci/test-gpu-deb-lifecycle.sh
          bash scripts/ci/test-openpgp-pin.sh
          bash scripts/ci/test-rootfs-overlay-boundary.sh
          bash scripts/ci/test-release-publication.sh

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap dosfstools mtools e2fsprogs rsync curl unzip tar xz-utils zstd p7zip-full \
            gdisk qemu-utils sudo ca-certificates gnupg binutils patch kmod \
            meson ninja-build pkg-config protobuf-c-compiler gcc-aarch64-linux-gnu \
            libglib2.0-dev:arm64 libqmi-glib-dev:arm64 libgudev-1.0-dev:arm64 libpolkit-gobject-1-dev:arm64 libprotobuf-c-dev:arm64

      - name: Validate kernel bootstrap policy
        run: |
          set -euo pipefail
          bash scripts/ci/test-kernel-bootstrap-policy.sh

      - name: Apply workflow configuration
        env:
          INPUT_OUTPUT_PREFIX: ${{ inputs.output_prefix }}
          INPUT_UBUNTU_MIRROR: ${{ inputs.ubuntu_mirror }}
          INPUT_ROOTFS_IMAGE_SIZE: ${{ inputs.rootfs_image_size }}
          INPUT_ROOTFS_LABEL: ${{ inputs.rootfs_label }}
          INPUT_HOSTNAME_NAME: ${{ inputs.hostname_name }}
          INPUT_ROOTFS_CONFIG: ${{ inputs.rootfs_config }}
          INPUT_BOOT_CONFIG: ${{ inputs.boot_config }}
          INPUT_SOURCE_CONFIG: ${{ inputs.source_config }}
        run: |
          set -euo pipefail
          . scripts/ci/common.sh
          ci_validate_output_prefix "$INPUT_OUTPUT_PREFIX"
          cat > "$RUNNER_TEMP/rootfs.env" <<'CONFIG_EOF'
          DISTRO=resolute
          ARCH=arm64
          DEBOOTSTRAP_VARIANT=
          ROOTFS_UUID=
          ROOTFS_PARTLABEL=userdata
          DEFAULT_USER_NAME=y700
          ROOT_PASSWORD_MODE=locked
          USER_SUDO_MODE=password
          SDDM_AUTOLOGIN=0
          SDDM_AUTOLOGIN_SESSION=plasma
          TZ_REGION=Asia/Shanghai
          LANG_NAME=zh_CN.UTF-8
          PACKAGE_LIST=
          DESKTOP_ENV=kubuntu-desktop
          OVERLAY_ARCHIVE=
          OVERLAY_ARCHIVE_SHA256=
          DEB_ARCHIVE=https://github.com/GUF296/ubuntu-y700-build-ci/releases/download/bootstrap-y700-20260625/y700-device-debs-20260624-201420-compat1.tar.gz
          DEB_ARCHIVE_SHA256=047c1baccc420f1c28bf6d761cfc811dd7aeccfcbab6d03746ca01daf6cdfe04
          BUILD_Y700_SENSOR_DEBS=1
          SENSOR_DEB_ARCHIVE=https://github.com/GUF296/tb321fu-sensor-debs/releases/download/tb321fu-sensor-debs-20260627.1/tb321fu-sensor-debs_20260627.1_arm64.tar.gz
          SENSOR_DEB_ARCHIVE_SHA256=62ebf6fb41730b9f52da2efc99ac5807fd41dd39d7f97dea070ba5f5ce34ab10
          SENSOR_SOURCE_ARCHIVE=
          SENSOR_SOURCE_ARCHIVE_SHA256=
          SENSOR_BASELINE_OVERLAY_ARCHIVE=
          SENSOR_BASELINE_OVERLAY_ARCHIVE_SHA256=
          SENSOR_DEB_VERSION=20260627.1
          SENSOR_STRIP=1
          BUILD_TB321FU_HAPTICS_DEB=1
          HAPTICS_DEB_ARCHIVE=https://github.com/GUF296/tb321fu-haptics-debs/releases/download/tb321fu-haptics-debs-20260627.2/tb321fu-haptics-debs_20260627.2_arm64.tar.gz
          HAPTICS_DEB_ARCHIVE_SHA256=5a87f510ad07ba60a8a2a663a0782e6f186a56b1586d52c816425fab45b20a37
          HAPTICS_SOURCE_ARCHIVE=
          HAPTICS_SOURCE_ARCHIVE_SHA256=
          KERNEL_SOURCE_ARCHIVE=
          KERNEL_SOURCE_ARCHIVE_SHA256=
          KERNEL_BUILD_ARCHIVE=
          KERNEL_BUILD_ARCHIVE_SHA256=
          HAPTICS_DEB_VERSION=20260627.2
          HAPTICS_STRIP=1
          BUILD_TB321FU_CAMERA_STACK=1
          CAMERA_STACK_ARCHIVE=
          CAMERA_STACK_ARCHIVE_SHA256=
          CAMERA_STACK_DIR=
          CAMERA_STACK_DEB_VERSION=20260627.4
          BUILD_TB321FU_GPU_SENSOR=1
          TB321FU_GPU_SENSOR_SOURCE_DIR=
          TB321FU_GPU_SENSOR_BUILD_JOBS=2
          INSTALL_GNOME_SNAPSHOT=1
          INSTALL_FIREFOX=1
          INSTALL_FCITX5_CHINESE=1
          DISABLE_SNAPD=1
          APPLY_Y700_FIRMWARE_FIXES=1
          APPLY_Y700_AUDIO_POLICY_FIXES=1
          CLEAN_APT_CACHE=1
          COMPRESS=7z
          CHUNK_SIZE=
          KEEP_RAW_IMAGE=0
          CONFIG_EOF
          cat > "$RUNNER_TEMP/boot.env" <<'CONFIG_EOF'
          BOOT_TEMPLATE_IMAGE=https://github.com/GUF296/ubuntu-y700-build-ci/releases/download/bootstrap-y700-20260625/y700-verified-grub-template-userdata-20260624-201420.img
          BOOT_TEMPLATE_IMAGE_SHA256=7136020f5c736e13772980af5d22652e71281f34ce3da7b22add928a62ebd194
          BOOT_IMAGE_SIZE=256M
          BOOT_FAT_BITS=32
          BOOT_FAT_LABEL=Y700GRUB
          BOOT_SECTOR_SIZE=512
          BOOT_CLUSTER_SECTORS=
          ROOT_SELECTOR=partlabel
          ROOT_PARTLABEL=userdata
          ROOT_UUID=
          ROOTARGS=
          ROOTARGS_EXTRA=
          STABLEARGS=drm_client_lib.active=none
          BOOT_COMPRESS=7z
          BOOT_CHUNK_SIZE=
          KEEP_BOOT_IMAGE=0
          CONFIG_EOF
          cat > "$RUNNER_TEMP/source.env" <<'CONFIG_EOF'
          KERNEL_ARTIFACT_ARCHIVE=https://github.com/GUF296/ubuntu-y700-build-ci/releases/download/bootstrap-y700-20260625/y700-kernel-artifacts-7.1.1-g5df8e852ea72.tar.gz
          KERNEL_ARTIFACT_ARCHIVE_SHA256=86ea0190e3a073a8ce94e1d6f74dcc3482457a0b9161c2ff968aaeb0f1147188
          BOOTAA64_EFI_URL=
          BOOTAA64_EFI_SHA256=
          QCOMRAMP_EFI_URL=
          QCOMRAMP_EFI_SHA256=
          QCOMRAMP_CFG_NAME=qcomramp.cfg
          GRUB_BUILD_ARCHIVE=
          GRUB_BUILD_ARCHIVE_SHA256=
          DTB_NAME=sm8650-lenovo-tb321fu.dtb
          CONFIG_EOF
          sed -i 's/^          //' "$RUNNER_TEMP/rootfs.env" "$RUNNER_TEMP/boot.env" "$RUNNER_TEMP/source.env"
          append_optional_config() {
            local config_file=$1
            local config_input=$2
            [ -n "$config_input" ] || return 0
            printf '\n%s\n' "$config_input" >> "$config_file"
          }
          append_optional_config "$RUNNER_TEMP/rootfs.env" "$INPUT_ROOTFS_CONFIG"
          append_optional_config "$RUNNER_TEMP/boot.env" "$INPUT_BOOT_CONFIG"
          append_optional_config "$RUNNER_TEMP/source.env" "$INPUT_SOURCE_CONFIG"
          {
            printf 'MIRROR=%s\n' "$INPUT_UBUNTU_MIRROR"
            printf 'ROOTFS_IMAGE_SIZE=%s\n' "$INPUT_ROOTFS_IMAGE_SIZE"
            printf 'ROOTFS_LABEL=%s\n' "$INPUT_ROOTFS_LABEL"
            printf 'HOSTNAME_NAME=%s\n' "$INPUT_HOSTNAME_NAME"
          } >> "$RUNNER_TEMP/rootfs.env"
          config_notes_dir="$RUNNER_TEMP/build-config-notes"
          mkdir -p "$config_notes_dir"
          cp "$RUNNER_TEMP/rootfs.env" "$config_notes_dir/rootfs.env"
          cp "$RUNNER_TEMP/boot.env" "$config_notes_dir/boot.env"
          cp "$RUNNER_TEMP/source.env" "$config_notes_dir/source.env"
          scripts/ci/apply-workflow-config.sh "$RUNNER_TEMP/rootfs.env"
          scripts/ci/apply-workflow-config.sh "$RUNNER_TEMP/boot.env"
          scripts/ci/apply-workflow-config.sh "$RUNNER_TEMP/source.env"
          {
            echo 'OUTPUT_DIR_ROOTFS=out/ci-rootfs'
            echo 'OUTPUT_DIR_GRUB=out/ci-grub'
            echo "BUILD_CONFIG_NOTES_DIR=$config_notes_dir"
            printf 'OUTPUT_PREFIX=%s\n' "$INPUT_OUTPUT_PREFIX"
          } >> "$GITHUB_ENV"

      - name: Verify kernel bundle handoff
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ] && [ "$PRERELEASE" != 1 ]; then
            echo 'Remediation releases must set prerelease=true.' >&2
            exit 1
          fi
          verified_dir="$RUNNER_TEMP/tb321fu-verified-kernel-bundle"
          env \
            OUTPUT_DIR="$verified_dir" \
            KERNEL_ARTIFACT_ARCHIVE="$KERNEL_ARTIFACT_ARCHIVE" \
            KERNEL_ARTIFACT_ARCHIVE_SHA256="$KERNEL_ARTIFACT_ARCHIVE_SHA256" \
            DEB_ARCHIVE="$DEB_ARCHIVE" \
            DEB_ARCHIVE_SHA256="$DEB_ARCHIVE_SHA256" \
            SENSOR_DEB_ARCHIVE="$SENSOR_DEB_ARCHIVE" \
            SENSOR_DEB_ARCHIVE_SHA256="$SENSOR_DEB_ARCHIVE_SHA256" \
            HAPTICS_DEB_ARCHIVE="$HAPTICS_DEB_ARCHIVE" \
            HAPTICS_DEB_ARCHIVE_SHA256="$HAPTICS_DEB_ARCHIVE_SHA256" \
            DTB_NAME="$DTB_NAME" \
            bash scripts/ci/verify-kernel-bundle.sh
          cat "$verified_dir/verified.env" >> "$GITHUB_ENV"
          install -m 0644 "$verified_dir/VERIFIED-INPUTS.tsv" \
            "${BUILD_CONFIG_NOTES_DIR:?}/verified-inputs.tsv"

      - name: Prepare GRUB build input
        run: |
          set -euo pipefail
          if [ -n "${GRUB_BUILD_ARCHIVE:-}" ]; then
            mkdir -p "$RUNNER_TEMP/grub-build"
            . scripts/ci/common.sh
            ci_download "$GRUB_BUILD_ARCHIVE" "$RUNNER_TEMP/grub-build.tar" \
              "${GRUB_BUILD_ARCHIVE_SHA256:-}"
            python3 scripts/ci/safe-extract-archive.py \
              "$RUNNER_TEMP/grub-build.tar" "$RUNNER_TEMP/grub-build"
            found=$(find "$RUNNER_TEMP/grub-build" -type f -name grub-mkstandalone -perm -111 | head -n1)
            test -n "$found"
            echo "Y700_GRUB_BUILD_DIR=$(dirname "$found")" >> "$GITHUB_ENV"
          elif [ -n "${QCOMRAMP_EFI_URL:-}" ]; then
            echo 'Y700_GRUB_BUILD_DIR=' >> "$GITHUB_ENV"
            echo 'Using prebuilt QCOMRAMP_EFI_URL; skipping grub-mkstandalone input.'
          elif [ -n "${BOOT_TEMPLATE_IMAGE:-}" ] || [ -n "${BOOT_TEMPLATE_IMAGE_URL:-}" ]; then
            echo 'Y700_GRUB_BUILD_DIR=' >> "$GITHUB_ENV"
            echo 'Using BOOT_TEMPLATE_IMAGE; preserving verified GRUB/EFI template.'
          else
            echo 'Either GRUB_BUILD_ARCHIVE, QCOMRAMP_EFI_URL, or BOOT_TEMPLATE_IMAGE must be set.' >&2
            exit 1
          fi

      - name: Build source sensor debs
        run: |
          set -euo pipefail
          if [ "${BUILD_Y700_SENSOR_DEBS:-0}" != "1" ]; then
            echo 'BUILD_Y700_SENSOR_DEBS is not 1; skipping.'
            echo 'Y700_SENSOR_DEB_DIR=' >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "${SENSOR_SOURCE_ARCHIVE:-}" ] && [ -z "${SENSOR_SOURCE_DIR:-}" ]; then
            if [ -n "${SENSOR_DEB_ARCHIVE:-}" ] || [ -n "${SENSOR_DEB_DIR:-}" ]; then
              echo 'Prebuilt sensor deb input provided; skipping source sensor deb build.'
              echo 'Y700_SENSOR_DEB_DIR=' >> "$GITHUB_ENV"
              exit 0
            fi
            echo 'BUILD_Y700_SENSOR_DEBS=1 requires SENSOR_SOURCE_ARCHIVE/SENSOR_SOURCE_DIR plus SENSOR_BASELINE_OVERLAY_ARCHIVE/SENSOR_BASELINE_OVERLAY_DIR, or provide SENSOR_DEB_ARCHIVE/SENSOR_DEB_DIR, or set BUILD_Y700_SENSOR_DEBS=0.' >&2
            exit 1
          fi
          if [ -z "${SENSOR_BASELINE_OVERLAY_ARCHIVE:-}" ] && [ -z "${SENSOR_BASELINE_OVERLAY_DIR:-}" ]; then
            if [ -n "${SENSOR_DEB_ARCHIVE:-}" ] || [ -n "${SENSOR_DEB_DIR:-}" ]; then
              echo 'Prebuilt sensor deb input provided; skipping source sensor deb build.'
              echo 'Y700_SENSOR_DEB_DIR=' >> "$GITHUB_ENV"
              exit 0
            fi
            echo 'BUILD_Y700_SENSOR_DEBS=1 requires SENSOR_BASELINE_OVERLAY_ARCHIVE/SENSOR_BASELINE_OVERLAY_DIR, or provide SENSOR_DEB_ARCHIVE/SENSOR_DEB_DIR, or set BUILD_Y700_SENSOR_DEBS=0.' >&2
            exit 1
          fi
          env OUTPUT_DIR="out/y700-sensor-debs" \
            ARCH="${ARCH:-arm64}" \
            SENSOR_DEB_VERSION="${SENSOR_DEB_VERSION:-20260626.1}" \
            SENSOR_SOURCE_ARCHIVE="${SENSOR_SOURCE_ARCHIVE:-}" \
            SENSOR_SOURCE_ARCHIVE_SHA256="${SENSOR_SOURCE_ARCHIVE_SHA256:-}" \
            SENSOR_SOURCE_DIR="${SENSOR_SOURCE_DIR:-}" \
            SENSOR_BASELINE_OVERLAY_ARCHIVE="${SENSOR_BASELINE_OVERLAY_ARCHIVE:-}" \
            SENSOR_BASELINE_OVERLAY_ARCHIVE_SHA256="${SENSOR_BASELINE_OVERLAY_ARCHIVE_SHA256:-}" \
            SENSOR_BASELINE_OVERLAY_DIR="${SENSOR_BASELINE_OVERLAY_DIR:-}" \
            SENSOR_STRIP="${SENSOR_STRIP:-1}" \
            bash scripts/ci/build-y700-sensor-debs.sh
          echo 'Y700_SENSOR_DEB_DIR=out/y700-sensor-debs' >> "$GITHUB_ENV"

      - name: Build source haptics deb
        run: |
          set -euo pipefail
          if [ "${BUILD_TB321FU_HAPTICS_DEB:-0}" != "1" ]; then
            echo 'BUILD_TB321FU_HAPTICS_DEB is not 1; skipping.'
            echo 'TB321FU_HAPTICS_DEB_DIR=' >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "${HAPTICS_SOURCE_ARCHIVE:-}" ] && [ -z "${HAPTICS_SOURCE_DIR:-}" ]; then
            if [ -n "${HAPTICS_DEB_ARCHIVE:-}" ] || [ -n "${HAPTICS_DEB_DIR:-}" ]; then
              echo 'Prebuilt haptics deb input provided; skipping source haptics deb build.'
              echo 'TB321FU_HAPTICS_DEB_DIR=' >> "$GITHUB_ENV"
              exit 0
            fi
            echo 'BUILD_TB321FU_HAPTICS_DEB=1 requires HAPTICS_SOURCE_ARCHIVE/HAPTICS_SOURCE_DIR plus KERNEL_SOURCE_ARCHIVE/KERNEL_SOURCE_DIR and KERNEL_BUILD_ARCHIVE/KERNEL_BUILD_DIR, or provide HAPTICS_DEB_ARCHIVE/HAPTICS_DEB_DIR, or set BUILD_TB321FU_HAPTICS_DEB=0.' >&2
            exit 1
          fi
          if [ -z "${KERNEL_SOURCE_ARCHIVE:-}" ] && [ -z "${KERNEL_SOURCE_DIR:-}" ]; then
            if [ -n "${HAPTICS_DEB_ARCHIVE:-}" ] || [ -n "${HAPTICS_DEB_DIR:-}" ]; then
              echo 'Prebuilt haptics deb input provided; skipping source haptics deb build.'
              echo 'TB321FU_HAPTICS_DEB_DIR=' >> "$GITHUB_ENV"
              exit 0
            fi
            echo 'BUILD_TB321FU_HAPTICS_DEB=1 requires KERNEL_SOURCE_ARCHIVE/KERNEL_SOURCE_DIR, or provide HAPTICS_DEB_ARCHIVE/HAPTICS_DEB_DIR, or set BUILD_TB321FU_HAPTICS_DEB=0.' >&2
            exit 1
          fi
          if [ -z "${KERNEL_BUILD_ARCHIVE:-}" ] && [ -z "${KERNEL_BUILD_DIR:-}" ]; then
            if [ -n "${HAPTICS_DEB_ARCHIVE:-}" ] || [ -n "${HAPTICS_DEB_DIR:-}" ]; then
              echo 'Prebuilt haptics deb input provided; skipping source haptics deb build.'
              echo 'TB321FU_HAPTICS_DEB_DIR=' >> "$GITHUB_ENV"
              exit 0
            fi
            echo 'BUILD_TB321FU_HAPTICS_DEB=1 requires KERNEL_BUILD_ARCHIVE/KERNEL_BUILD_DIR, or provide HAPTICS_DEB_ARCHIVE/HAPTICS_DEB_DIR, or set BUILD_TB321FU_HAPTICS_DEB=0.' >&2
            exit 1
          fi
          env OUTPUT_DIR="out/tb321fu-haptics-debs" \
            ARCH="${ARCH:-arm64}" \
            HAPTICS_DEB_VERSION="${HAPTICS_DEB_VERSION:-20260627.1}" \
            HAPTICS_SOURCE_ARCHIVE="${HAPTICS_SOURCE_ARCHIVE:-}" \
            HAPTICS_SOURCE_ARCHIVE_SHA256="${HAPTICS_SOURCE_ARCHIVE_SHA256:-}" \
            HAPTICS_SOURCE_DIR="${HAPTICS_SOURCE_DIR:-}" \
            KERNEL_SOURCE_ARCHIVE="${KERNEL_SOURCE_ARCHIVE:-}" \
            KERNEL_SOURCE_ARCHIVE_SHA256="${KERNEL_SOURCE_ARCHIVE_SHA256:-}" \
            KERNEL_SOURCE_DIR="${KERNEL_SOURCE_DIR:-}" \
            KERNEL_BUILD_ARCHIVE="${KERNEL_BUILD_ARCHIVE:-}" \
            KERNEL_BUILD_ARCHIVE_SHA256="${KERNEL_BUILD_ARCHIVE_SHA256:-}" \
            KERNEL_BUILD_DIR="${KERNEL_BUILD_DIR:-}" \
            HAPTICS_STRIP="${HAPTICS_STRIP:-1}" \
            bash scripts/ci/build-tb321fu-haptics-deb.sh
          echo 'TB321FU_HAPTICS_DEB_DIR=out/tb321fu-haptics-debs' >> "$GITHUB_ENV"

      - name: Build verified camera stack deb
        run: |
          set -euo pipefail
          if [ "${BUILD_TB321FU_CAMERA_STACK:-0}" != "1" ]; then
            echo 'BUILD_TB321FU_CAMERA_STACK is not 1; skipping.'
            echo 'TB321FU_CAMERA_STACK_DEB_DIR=' >> "$GITHUB_ENV"
            exit 0
          fi
          env OUTPUT_DIR="out/tb321fu-camera-stack-debs" \
            ARCH="${ARCH:-arm64}" \
            CAMERA_STACK_DEB_VERSION="${CAMERA_STACK_DEB_VERSION:-20260627.4}" \
            CAMERA_STACK_ARCHIVE="${CAMERA_STACK_ARCHIVE:-}" \
            CAMERA_STACK_ARCHIVE_SHA256="${CAMERA_STACK_ARCHIVE_SHA256:-}" \
            CAMERA_STACK_DIR="${CAMERA_STACK_DIR:-}" \
            bash scripts/ci/build-tb321fu-camera-stack-deb.sh
          echo 'TB321FU_CAMERA_STACK_DEB_DIR=out/tb321fu-camera-stack-debs' >> "$GITHUB_ENV"

      - name: Build rootfs image
        env:
          DEFAULT_USER_PASSWORD_HASH: ${{ secrets.DEFAULT_USER_PASSWORD_HASH }}
          DEFAULT_USER_AUTHORIZED_KEYS: ${{ secrets.DEFAULT_USER_AUTHORIZED_KEYS }}
          ROOT_PASSWORD_HASH: ${{ secrets.ROOT_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          sudo --preserve-env=OUTPUT_PREFIX,DISTRO,ARCH,MIRROR,DEBOOTSTRAP_VARIANT,RESOLV_CONF_CONTENT,APT_HTTP_PROXY,APT_HTTPS_PROXY,http_proxy,https_proxy,HTTP_PROXY,HTTPS_PROXY,APT_SOURCES_LIST,ROOTFS_IMAGE_SIZE,ROOTFS_UUID,ROOTFS_LABEL,ROOTFS_PARTLABEL,HOSTNAME_NAME,DEFAULT_USER_NAME,DEFAULT_USER_PASSWORD_HASH,DEFAULT_USER_AUTHORIZED_KEYS,ROOT_PASSWORD_MODE,ROOT_PASSWORD_HASH,USER_SUDO_MODE,SDDM_AUTOLOGIN,SDDM_AUTOLOGIN_SESSION,TZ_REGION,LOCALES,LANG_NAME,PACKAGE_LIST,DESKTOP_ENV,OVERLAY_ARCHIVE,OVERLAY_ARCHIVE_SHA256,DEB_ARCHIVE,DEB_ARCHIVE_SHA256,DEB_DIR,SENSOR_DEB_ARCHIVE,SENSOR_DEB_ARCHIVE_SHA256,SENSOR_DEB_DIR,HAPTICS_DEB_ARCHIVE,HAPTICS_DEB_ARCHIVE_SHA256,HAPTICS_DEB_DIR,CAMERA_STACK_DEB_DIR,BUILD_TB321FU_GPU_SENSOR,TB321FU_GPU_SENSOR_SOURCE_DIR,TB321FU_GPU_SENSOR_BUILD_JOBS,INSTALL_GNOME_SNAPSHOT,INSTALL_FIREFOX,INSTALL_FCITX5_CHINESE,FCITX5_CHINESE_PACKAGES,DISABLE_SNAPD,APPLY_Y700_FIRMWARE_FIXES,APPLY_Y700_AUDIO_POLICY_FIXES,CLEAN_APT_CACHE,COMPRESS,CHUNK_SIZE,KEEP_RAW_IMAGE \
            env OUTPUT_DIR="$OUTPUT_DIR_ROOTFS" SENSOR_DEB_DIR="${Y700_SENSOR_DEB_DIR:-${SENSOR_DEB_DIR:-}}" HAPTICS_DEB_DIR="${TB321FU_HAPTICS_DEB_DIR:-${HAPTICS_DEB_DIR:-}}" CAMERA_STACK_DEB_DIR="${TB321FU_CAMERA_STACK_DEB_DIR:-}" bash scripts/ci/build-rootfs-image.sh
          sudo chown -R "$USER:$USER" out

      - name: Build GRUB boot image
        run: |
          set -euo pipefail
          env OUTPUT_DIR="$OUTPUT_DIR_GRUB" \
            OUTPUT_PREFIX="$OUTPUT_PREFIX" \
            BOOT_TEMPLATE_IMAGE="${BOOT_TEMPLATE_IMAGE:-}" \
            BOOT_TEMPLATE_IMAGE_URL="${BOOT_TEMPLATE_IMAGE_URL:-}" \
            BOOT_TEMPLATE_IMAGE_SHA256="${BOOT_TEMPLATE_IMAGE_SHA256:-}" \
            BOOT_IMAGE_SIZE="$BOOT_IMAGE_SIZE" \
            BOOT_FAT_BITS="$BOOT_FAT_BITS" \
            BOOT_FAT_LABEL="$BOOT_FAT_LABEL" \
            BOOT_SECTOR_SIZE="$BOOT_SECTOR_SIZE" \
            BOOT_CLUSTER_SECTORS="$BOOT_CLUSTER_SECTORS" \
            KERNEL_ARTIFACT_ARCHIVE="$KERNEL_ARTIFACT_ARCHIVE" \
            KERNEL_ARTIFACT_ARCHIVE_SHA256="${KERNEL_ARTIFACT_ARCHIVE_SHA256:-}" \
            BOOTAA64_EFI_URL="$BOOTAA64_EFI_URL" \
            BOOTAA64_EFI_SHA256="${BOOTAA64_EFI_SHA256:-}" \
            QCOMRAMP_EFI_URL="$QCOMRAMP_EFI_URL" \
            QCOMRAMP_EFI_SHA256="${QCOMRAMP_EFI_SHA256:-}" \
            QCOMRAMP_CFG_NAME="$QCOMRAMP_CFG_NAME" \
            DTB_NAME="$DTB_NAME" \
            ROOT_SELECTOR="$ROOT_SELECTOR" \
            ROOT_PARTLABEL="$ROOT_PARTLABEL" \
            ROOT_UUID="$ROOT_UUID" \
            ROOTARGS="$ROOTARGS" \
            ROOTARGS_EXTRA="$ROOTARGS_EXTRA" \
            STABLEARGS="$STABLEARGS" \
            BOOT_COMPRESS="$BOOT_COMPRESS" \
            BOOT_CHUNK_SIZE="$BOOT_CHUNK_SIZE" \
            KEEP_BOOT_IMAGE="$KEEP_BOOT_IMAGE" \
            Y700_GRUB_BUILD_DIR="$Y700_GRUB_BUILD_DIR" \
            bash scripts/ci/build-grub-image.sh

      - name: Write combined checksums
        run: |
          set -euo pipefail
          mkdir -p out/ci-release
          install -m 0644 "${VERIFIED_KERNEL_BUNDLE_DIR:?}/KERNEL-BUNDLE.tsv" \
            out/ci-release/KERNEL-BUNDLE.tsv
          install -m 0644 "$VERIFIED_KERNEL_BUNDLE_DIR/VERIFIED-BUNDLE.tsv" \
            out/ci-release/VERIFIED-BUNDLE.tsv
          install -m 0644 "$VERIFIED_KERNEL_BUNDLE_DIR/VERIFIED-INPUTS.tsv" \
            out/ci-release/VERIFIED-INPUTS.tsv
          checksum_dirs=("$OUTPUT_DIR_ROOTFS" "$OUTPUT_DIR_GRUB")
          if [ -d out/y700-sensor-debs ]; then
            checksum_dirs+=(out/y700-sensor-debs)
          fi
          if [ -d out/tb321fu-haptics-debs ]; then
            checksum_dirs+=(out/tb321fu-haptics-debs)
          fi
          if [ -d out/tb321fu-camera-stack-debs ]; then
            checksum_dirs+=(out/tb321fu-camera-stack-debs)
          fi
          bash scripts/ci/write-portable-checksums.sh \
            out/ci-release/SHA256SUMS.txt "${checksum_dirs[@]}" \
            out/ci-release/KERNEL-BUNDLE.tsv \
            out/ci-release/VERIFIED-BUNDLE.tsv \
            out/ci-release/VERIFIED-INPUTS.tsv

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.output_prefix }}-rootfs-grub
          path: |
            out/ci-rootfs/*
            out/ci-grub/*
            out/y700-sensor-debs/*
            out/tb321fu-haptics-debs/*
            out/tb321fu-camera-stack-debs/*
            out/ci-release/*.tsv
            out/ci-release/SHA256SUMS.txt

      - name: Upload release assets
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
        run: |
          set -euo pipefail
          release_dir=out/ci-release/assets
          [ "$release_dir" = out/ci-release/assets ] || {
            echo "refusing unbounded release staging cleanup: $release_dir" >&2
            exit 1
          }
          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          select_release_asset() {
            local source_dir=$1
            local source_prefix=$2
            local release_name=$3
            local compress=$4
            local chunk_size=$5
            local suffix src dest

            case "$compress" in
              none) suffix=.img; src="$source_dir/$source_prefix" ;;
              zstd) suffix=.img.zst; src="$source_dir/$source_prefix.zst" ;;
              xz) suffix=.img.xz; src="$source_dir/$source_prefix.xz" ;;
              7z)
                if [ -n "$chunk_size" ]; then
                  echo "Release upload expects a single $release_name archive; clear CHUNK_SIZE/BOOT_CHUNK_SIZE instead of using 7z volumes." >&2
                  exit 1
                fi
                suffix=.img.7z
                src="$source_dir/$source_prefix.7z"
                ;;
              *) echo "unsupported $release_name compression: $compress" >&2; exit 1 ;;
            esac

            [ -f "$src" ] || { echo "missing release $release_name asset: $src" >&2; exit 1; }
            dest="$release_dir/${release_name}${suffix}"
            cp -a "$src" "$dest"
          }

          select_release_asset "$OUTPUT_DIR_ROOTFS" "${OUTPUT_PREFIX}-rootfs.img" rootfs "${COMPRESS:-7z}" "${CHUNK_SIZE:-}"
          select_release_asset "$OUTPUT_DIR_GRUB" "${OUTPUT_PREFIX}-grub-fat.img" grub "${BOOT_COMPRESS:-7z}" "${BOOT_CHUNK_SIZE:-}"
          install -m 0644 source/boot-image/boot.img.7z "$release_dir/boot.img.7z"
          install -m 0644 "${VERIFIED_KERNEL_BUNDLE_DIR:?}/KERNEL-BUNDLE.tsv" \
            "$release_dir/KERNEL-BUNDLE.tsv"
          install -m 0644 "$VERIFIED_KERNEL_BUNDLE_DIR/VERIFIED-BUNDLE.tsv" \
            "$release_dir/VERIFIED-BUNDLE.tsv"
          install -m 0644 "$VERIFIED_KERNEL_BUNDLE_DIR/VERIFIED-INPUTS.tsv" \
            "$release_dir/VERIFIED-INPUTS.tsv"

          split_large_release_assets() {
            local max_bytes=1992294400
            local asset size

            while IFS= read -r -d '' asset; do
              size=$(stat -c '%s' "$asset")
              if [ "$size" -le "$max_bytes" ]; then
                continue
              fi
              echo "Splitting release asset larger than GitHub's 2GB limit: $asset ($size bytes)"
              split -b 1900M -d -a 3 "$asset" "$asset."
              rm -f "$asset"
            done < <(find "$release_dir" -maxdepth 1 -type f -print0)
          }

          split_large_release_assets
          (cd "$release_dir" && sha256sum * > SHA256SUMS.txt)

          notes=out/ci-release/BUILD-PARAMETERS.md
          rootfs_notes=out/ci-release/rootfs-config-for-notes.txt
          boot_notes=out/ci-release/boot-config-for-notes.txt
          source_notes=out/ci-release/source-config-for-notes.txt
          verified_inputs_notes=out/ci-release/verified-inputs-for-notes.tsv
          cp "${BUILD_CONFIG_NOTES_DIR:?}/rootfs.env" "$rootfs_notes"
          cp "${BUILD_CONFIG_NOTES_DIR:?}/boot.env" "$boot_notes"
          cp "${BUILD_CONFIG_NOTES_DIR:?}/source.env" "$source_notes"
          cp "${BUILD_CONFIG_NOTES_DIR:?}/verified-inputs.tsv" "$verified_inputs_notes"
          {
            echo '# Build Parameters'
            echo
            echo "- Output prefix: \`$OUTPUT_PREFIX\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Generated: \`$(date -u -Iseconds)\`"
            echo
            echo 'Password hashes are supplied only through step-scoped secrets and are never serialized into build configuration or release notes.'
            echo 'The release asset names are intentionally short: `boot.img.7z`, `grub.img.7z`, and split rootfs parts such as `rootfs.img.7z.000` / `rootfs.img.7z.001`.'
            echo 'Assets ending in `.NNN` are split only to satisfy the GitHub Release 2GB per-asset limit. Recombine them in lexical order before extraction, for example: `cat rootfs.img.7z.* > rootfs.img.7z`.'
            echo
            echo '## rootfs_config'
            echo '```text'
            cat "$rootfs_notes"
            echo '```'
            echo
            echo '## boot_config'
            echo '```text'
            cat "$boot_notes"
            echo '```'
            echo
            echo '## source_config'
            echo '```text'
            cat "$source_notes"
            echo '```'
            echo
            echo '## Verified bootstrap inputs'
            echo '```text'
            cat "$verified_inputs_notes"
            echo '```'
          } > "$notes"

          bash scripts/ci/publish-release.sh "$RELEASE_TAG" "$release_dir" "$notes"
